<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-gradient-start: #1a1a24;
            --bg-gradient-end: #0f0f14;
            --panel-bg: #22222e;
            --input-bg: #16161f;
            --accent-green: #00c853;
            --accent-green-hover: #00e676;
            --text-main: #ffffff;
            --text-muted: #8e8e9f;
            --card-width: 350px;
            --card-height: 200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PREVIEW SECTION --- */
        .preview-section {
            height: 42vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px;
            position: relative;
        }

        .view-switcher {
            display: flex;
            background: var(--panel-bg);
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 18px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .switch-btn.active {
            background: var(--accent-green);
            color: #000000;
        }

        .card-stage {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1000px;
            position: relative;
        }

        /* --- CARD ARCHITECTURE --- */
        .business-card {
            width: var(--card-width);
            height: var(--card-height);
            background: #0d0d0e;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            position: absolute;
            top: 0;
            left: 0;
            display: none; 
            overflow: hidden;
        }

        .business-card.active {
            display: flex; 
        }

        /* --- FRONT SIDE DESIGN --- */
        .front-left-stripe {
            width: 22%;
            height: 100%;
            background: #00c853; 
            border-left: 12px solid #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 15px;
            position: relative;
        }

        .front-left-stripe .vertical-text-wrap {
            transform: rotate(180deg);
            writing-mode: vertical-rl;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .front-left-stripe .card-logo-name {
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .front-left-stripe .logo-icon-mini {
            width: 14px;
            height: 14px;
            transform: rotate(90deg);
        }

        .front-main-content {
            width: 78%;
            height: 100%;
            padding: 22px 20px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-header {
            display: flex;
            flex-direction: column;
        }

        .profile-name {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            line-height: 1.2;
            color: #ffffff;
        }

        .profile-name span {
            color: #00c853;
        }

        .profile-title {
            font-size: 7.5px;
            color: #ffffff;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            margin-top: 4px;
            font-weight: 400;
            opacity: 0.9;
        }

        .decorator-line {
            width: 75px;
            height: 1.5px;
            background: linear-gradient(90deg, #00c853 55%, #ffffff 55%);
            margin-top: 5px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            z-index: 2;
            width: 100%;
        }

        .contact-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            width: 100%;
        }

        .contact-text-block {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .contact-val {
            font-size: 7.5px;
            color: #e0e0e0;
            font-weight: 400;
            line-height: 1.3;
            text-align: right;
        }

        .contact-icon-pill {
            background: #00c853;
            width: 42px;
            height: 14px;
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 7.5px;
            margin-right: -20px; /* Safe containment margin boundary */
        }

        /* --- BACK SIDE DESIGN --- */
        .card-back {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-watermark {
            position: absolute;
            width: 180px;
            height: 180px;
            opacity: 0.03;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-center-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .back-logo-graphic {
            width: 42px;
            height: 42px;
            margin-bottom: 8px;
        }

        .back-company-title {
            color: #00c853;
            font-size: 19px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
        }

        .back-web-infinitum {
            display: flex;
            align-items: center;
            width: 170px;
            margin-top: 6px;
        }

        .back-web-infinitum::before,
        .back-web-infinitum::after {
            content: "";
            flex: 1;
            height: 0.8px;
            background: rgba(255, 255, 255, 0.25);
        }

        .back-web-text {
            color: #ffffff;
            font-size: 7.5px;
            letter-spacing: 1px;
            padding: 0 8px;
            white-space: nowrap;
            text-transform: lowercase;
        }

        .vector-logo {
            width: 100%;
            height: 100%;
        }

        /* --- EDITOR ENGINE SECTION --- */
        .editor-section {
            height: 58vh;
            background: var(--panel-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.3);
        }

        .editor-section::-webkit-scrollbar {
            width: 4px;
        }
        .editor-section::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .input-field {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 14px;
            -webkit-user-select: text;
            user-select: text;
            transition: all 0.3s ease;
        }

        .input-field:focus {
            outline: none;
            border-color: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 200, 83, 0.2);
        }

        .row-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .save-btn {
            background: linear-gradient(90deg, var(--accent-green), var(--accent-green-hover));
            color: #000000;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Webview Overlay Modal */
        .export-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-card-view {
            max-width: 100%;
            max-height: 75vh;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 20px;
            object-fit: contain;
        }
        .modal-close-btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="preview-section">
        <div class="view-switcher">
            <button class="switch-btn active" id="btn-front" onclick="switchCardSide('front')">Front Side</button>
            <button class="switch-btn" id="btn-back" onclick="switchCardSide('back')">Back Side</button>
        </div>

        <div class="card-stage">
            <!-- Front Card (Starts Active) -->
            <div class="business-card card-front active" id="render-front">
                <div class="front-left-stripe">
                    <div class="vertical-text-wrap">
                        <span class="card-logo-name target-company">Jone Dubble</span>
                        <div class="logo-icon-mini">
                            <svg class="vector-logo" viewBox="0 0 100 100">
                                <path d="M45 25 L25 45 A8 8 0 0 0 25 55 L45 75" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M55 25 L75 45 A8 8 0 0 1 75 55 L55 75" fill="none" stroke="#00c853" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="front-main-content">
                    <div class="profile-header">
                        <div class="profile-name" id="display-name">Jone <span>Dubble</span></div>
                        <div class="profile-title" id="display-title">Professional Director</div>
                        <div class="decorator-line"></div>
                    </div>
                    
                    <div class="contact-list">
                        <div class="contact-row">
                            <div class="contact-text-block">
                                <span class="contact-val" id="display-phone1">00 000 0000</span>
                                <span class="contact-val" id="display-phone2">00 000 0000</span>
                            </div>
                            <div class="contact-icon-pill"><i class="fa-solid fa-phone"></i></div>
                        </div>
                        <div class="contact-row">
                            <div class="contact-text-block">
                                <span class="contact-val" id="display-email1">yourinfo@urmail.com</span>
                                <span class="contact-val" id="display-email2">yourinfo@urmail.com</span>
                            </div>
                            <div class="contact-icon-pill"><i class="fa-solid fa-envelope"></i></div>
                        </div>
                        <div class="contact-row">
                            <div class="contact-text-block">
                                <span class="contact-val" id="display-web1">www.urwebsite.com</span>
                                <span class="contact-val" id="display-web2">www.urwebsite.com</span>
                            </div>
                            <div class="contact-icon-pill"><i class="fa-solid fa-globe"></i></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Back Card -->
            <div class="business-card card-back" id="render-back">
                <div class="back-watermark">
                    <svg style="width:100%; height:100%;" viewBox="0 0 100 100">
                        <path d="M45 25 L25 45 A8 8 0 0 0 25 55 L45 75" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M55 25 L75 45 A8 8 0 0 1 75 55 L55 75" fill="none" stroke="#00c853" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="back-center-group">
                    <div class="back-logo-graphic">
                        <svg class="vector-logo" viewBox="0 0 100 100">
                            <path d="M45 25 L25 45 A8 8 0 0 0 25 55 L45 75" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M55 25 L75 45 A8 8 0 0 1 75 55 L55 75" fill="none" stroke="#00c853" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="back-company-title target-company">Jone Dubble</div>
                    <div class="back-web-infinitum">
                        <div class="back-web-text" id="display-back-web">www.urwebsite.com</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-section">
        <div class="input-group">
            <label>Logo / Company Name</label>
            <input type="text" class="input-field" id="input-company" value="Jone Dubble">
        </div>

        <div class="row-inputs">
            <div class="input-group">
                <label>First Name</label>
                <input type="text" class="input-field" id="input-fname" value="Jone">
            </div>
            <div class="input-group">
                <label>Last Name</label>
                <input type="text" class="input-field" id="input-lname" value="Dubble">
            </div>
        </div>

        <div class="input-group">
            <label>Job Title</label>
            <input type="text" class="input-field" id="input-title" value="Professional Director">
        </div>

        <div class="row-inputs">
            <div class="input-group">
                <label>Phone Line 1</label>
                <input type="text" class="input-field" id="input-phone1" value="00 000 0000">
            </div>
            <div class="input-group">
                <label>Phone Line 2</label>
                <input type="text" class="input-field" id="input-phone2" value="00 000 0000">
            </div>
        </div>

        <div class="row-inputs">
            <div class="input-group">
                <label>Email Line 1</label>
                <input type="email" class="input-field" id="input-email1" value="yourinfo@urmail.com">
            </div>
            <div class="input-group">
                <label>Email Line 2</label>
                <input type="email" class="input-field" id="input-email2" value="yourinfo@urmail.com">
            </div>
        </div>

        <div class="row-inputs">
            <div class="input-group">
                <label>Website Line 1</label>
                <input type="text" class="input-field" id="input-web1" value="www.urwebsite.com">
            </div>
            <div class="input-group">
                <label>Website Line 2</label>
                <input type="text" class="input-field" id="input-web2" value="www.urwebsite.com">
            </div>
        </div>

        <button class="save-btn" onclick="triggerCardExport()">
            <i class="fa-solid fa-circle-down"></i> Save Both Sides
        </button>
    </div>

    <div class="export-modal" id="previewModal">
        <h3 style="margin-bottom:10px; font-size:16px;">Long Press Image to Save</h3>
        <img class="modal-card-view" id="exportedImageContainer" src="" alt="Generated Business Card">
        <button class="modal-close-btn" onclick="closeExportModal()">Close Preview</button>
    </div>

    <script>
        let currentSide = 'front';

        // Real-time Input Listeners
        document.getElementById('input-company').addEventListener('input', function() {
            const elements = document.querySelectorAll('.target-company');
            elements.forEach(el => el.innerText = this.value);
        });

        function updateNameLayout() {
            const fn = document.getElementById('input-fname').value;
            const ln = document.getElementById('input-lname').value;
            document.getElementById('display-name').innerHTML = `${fn} <span>${ln}</span>`;
        }

        document.getElementById('input-fname').addEventListener('input', updateNameLayout);
        document.getElementById('input-lname').addEventListener('input', updateNameLayout);

        document.getElementById('input-title').addEventListener('input', function() {
            document.getElementById('display-title').innerText = this.value;
        });

        document.getElementById('input-phone1').addEventListener('input', function() {
            document.getElementById('display-phone1').innerText = this.value;
        });
        document.getElementById('input-phone2').addEventListener('input', function() {
            document.getElementById('display-phone2').innerText = this.value;
        });

        document.getElementById('input-email1').addEventListener('input', function() {
            document.getElementById('display-email1').innerText = this.value;
        });
        document.getElementById('input-email2').addEventListener('input', function() {
            document.getElementById('display-email2').innerText = this.value;
        });

        document.getElementById('input-web1').addEventListener('input', function() {
            document.getElementById('display-web1').innerText = this.value;
            document.getElementById('display-back-web').innerText = this.value;
        });
        document.getElementById('input-web2').addEventListener('input', function() {
            document.getElementById('display-web2').innerText = this.value;
        });

        // Tab View Swapper
        function switchCardSide(side) {
            currentSide = side;
            document.getElementById('btn-front').classList.toggle('active', side === 'front');
            document.getElementById('btn-back').classList.toggle('active', side === 'back');
            
            if(side === 'front') {
                document.getElementById('render-front').classList.add('active');
                document.getElementById('render-back').classList.remove('active');
            } else {
                document.getElementById('render-front').classList.remove('active');
                document.getElementById('render-back').classList.add('active');
            }
        }

        // High-Stability Export Engine
        function triggerCardExport() {
            document.fonts.ready.then(() => {
                const frontCard = document.getElementById('render-front');
                const backCard = document.getElementById('render-back');
                
                // Track original visual states
                const originalFrontClass = frontCard.className;
                const originalBackClass = backCard.className;

                // Momentarily force visibility layout structures synchronously
                frontCard.classList.add('active');
                backCard.classList.add('active');

                const renderOptions = {
                    scale: 3, 
                    useCORS: true,
                    backgroundColor: null,
                    logging: false,
                    width: 350,  // Exact layout width constraints
                    height: 200  // Exact layout height constraints
                };

                // Capture Front Side Block
                html2canvas(frontCard, renderOptions).then(frontCanvas => {
                    // Capture Back Side Block
                    html2canvas(backCard, renderOptions).then(backCanvas => {
                        
                        // Revert active class structures before browser re-draw runs
                        frontCard.className = originalFrontClass;
                        backCard.className = originalBackClass;

                        const mainCanvas = document.createElement('canvas');
                        const ctx = mainCanvas.getContext('2d');

                        const cardW = frontCanvas.width;
                        const cardH = frontCanvas.height;

                        const paddingX = cardW * 0.12; 
                        const paddingY = cardH * 0.15; 
                        const gapY = cardH * 0.12;     

                        mainCanvas.width = cardW + (paddingX * 2);
                        mainCanvas.height = (cardH * 2) + (paddingY * 2) + gapY;

                        // Canvas Base Fill Layer
                        ctx.fillStyle = '#f0f2f5';
                        ctx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);

                        // Position Elements
                        ctx.drawImage(frontCanvas, paddingX, paddingY);
                        ctx.drawImage(backCanvas, paddingX, paddingY + cardH + gapY);

                        const dataUrl = mainCanvas.toDataURL('image/png');
                        
                        const downloadLink = document.createElement('a');
                        downloadLink.download = `BusinessCard_Presentation.png`;
                        downloadLink.href = dataUrl;
                        document.body.appendChild(downloadLink);
                        downloadLink.click();
                        document.body.removeChild(downloadLink);

                        document.getElementById('exportedImageContainer').src = dataUrl;
                        document.getElementById('previewModal').style.display = 'flex';

                    }).catch(err => {
                        frontCard.className = originalFrontClass;
                        backCard.className = originalBackClass;
                        alert("Export computation crash: " + err);
                    });
                }).catch(err => {
                    frontCard.className = originalFrontClass;
                    backCard.className = originalBackClass;
                    alert("Export computation crash: " + err);
                });
            });
        }

        function closeExportModal() {
            document.getElementById('previewModal').style.display = 'none';
        }
    </script>
</body>
</html>
