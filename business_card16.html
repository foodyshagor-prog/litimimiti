<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Business Card Editor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark-main: #0b0b12;
            --bg-dark-card: #141420;
            --bg-dark-input: #1e1e2f;
            --accent-purple: #8c52ff;
            --accent-purple-dark: #3d0066;
            --text-primary: #ffffff;
            --text-secondary: #9fa0af;
            
            /* Native standard 3.5:2 ratio scaled down for mobile screens */
            --card-base-w: 350px;
            --card-base-h: 200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark-main);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- TOP PREVIEW AREA --- */
        .preview-container {
            background: linear-gradient(180deg, #1a1a26 0%, #0b0b12 100%);
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }

        /* Segmented control for mobile switching */
        .toggle-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            padding: 3px;
            border-radius: 12px;
            margin-bottom: 15px;
            width: 80%;
            max-width: 280px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 0;
            font-size: 13px;
            font-weight: 600;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent-purple);
            color: var(--text-primary);
            box-shadow: 0 2px 10px rgba(140, 82, 255, 0.3);
        }

        .card-scaler-box {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Fixed compact sizing */
        .bc-card {
            width: var(--card-base-w);
            height: var(--card-base-h);
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: none;
            position: relative;
            transform-origin: center center;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolygon points='0,0 30,30 0,60' fill='%23fbfbfb' opacity='0.6'/%3E%3Cpolygon points='60,0 30,30 60,60' fill='%23f7f7f7' opacity='0.6'/%3E%3C/svg%3E");
        }

        .bc-card.active {
            display: block;
        }

        .vector-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .card-inner-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        /* Front Page Styling */
        .front-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }

        .c-logo {
            font-size: 34px;
            font-weight: 800;
            color: var(--accent-purple-dark);
            line-height: 1;
            margin-bottom: 2px;
            letter-spacing: -1px;
        }

        .c-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-purple-dark);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .c-tagline {
            font-size: 7.5px;
            color: #444;
            letter-spacing: 1.5px;
            margin-top: 3px;
            text-transform: uppercase;
            position: relative;
        }

        .c-tagline::after {
            content: '';
            position: absolute;
            right: -18px;
            top: 50%;
            width: 12px;
            height: 1.5px;
            background-color: var(--accent-purple-dark);
        }

        /* Back Page Styling */
        .back-layout {
            padding: 24px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
        }

        .p-meta {
            margin-top: 5px;
        }

        .p-name {
            font-size: 18px;
            font-weight: 700;
            color: var(--accent-purple-dark);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .p-title {
            font-size: 7.5px;
            color: #555;
            letter-spacing: 2px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            margin-top: 3px;
            font-weight: 600;
        }

        .p-title::before {
            content: '';
            display: inline-block;
            width: 10px;
            height: 1.5px;
            background-color: var(--accent-purple-dark);
            margin-right: 6px;
        }

        .contact-list {
            margin-bottom: 5px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-width: 180px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-holder {
            width: 16px;
            height: 16px;
            background-color: var(--accent-purple-dark);
            border-radius: 3px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-holder svg {
            width: 9px;
            height: 9px;
            fill: white;
        }

        .contact-val {
            font-size: 6.5px;
            color: #222;
            line-height: 1.3;
            font-weight: 600;
        }

        /* --- BOTTOM EDITOR AREA --- */
        .editor-container {
            flex: 1;
            background-color: var(--bg-dark-card);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px;
            overflow-y: auto;
        }

        .form-pane {
            display: none;
        }

        .form-pane.active {
            display: block;
        }

        .field-group {
            margin-bottom: 14px;
        }

        .field-group label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 5px;
            font-weight: 500;
        }

        .field-group input {
            width: 100%;
            background-color: var(--bg-dark-input);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: var(--text-primary);
            padding: 12px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .field-group input:focus {
            border-color: var(--accent-purple);
            background-color: rgba(140, 82, 255, 0.05);
        }

        .save-action-btn {
            width: 100%;
            background: linear-gradient(90deg, #6c22e6, var(--accent-purple));
            color: white;
            border: none;
            padding: 15px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(140, 82, 255, 0.25);
            cursor: pointer;
        }

        .save-action-btn:active {
            transform: scale(0.98);
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="preview-container" id="previewContainer">
        <div class="toggle-switch">
            <button class="toggle-btn active" id="btn-tab-front" onclick="switchView('front')">Front Side</button>
            <button class="toggle-btn" id="btn-tab-back" onclick="switchView('back')">Back Side</button>
        </div>
        
        <div class="card-scaler-box" id="scalerBox">
            <div class="bc-card active" id="view-front">
                <svg class="vector-layer" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <path d="M0,0 Q50,25 100,0 Z" fill="#f0e6f5" opacity="0.5"/>
                    <path d="M0,200 Q75,150 150,200 Z" fill="#3d0066"/> 
                    <path d="M0,200 Q90,180 125,200 Z" fill="#7a288a"/>
                    <path d="M175,200 Q275,110 350,40 L350,200 Z" fill="#d8b4e2"/>
                    <path d="M210,200 Q290,130 350,60 L350,200 Z" fill="#7a288a"/>
                    <path d="M240,200 Q310,150 350,90 L350,200 Z" fill="#3d0066"/>
                </svg>
                <div class="card-inner-content front-layout">
                    <div class="c-logo" id="lbl-logo">R</div>
                    <div class="c-name" id="lbl-company">COMPANY NAME</div>
                    <div class="c-tagline" id="lbl-tagline">YOUR TAG LINE HERE</div>
                </div>
            </div>

            <div class="bc-card" id="view-back">
                <svg class="vector-layer" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <path d="M250,0 Q325,40 350,90 L350,0 Z" fill="#7a288a"/>
                    <path d="M0,125 Q50,100 125,200 L0,200 Z" fill="#7a288a"/>
                    <path d="M0,140 Q40,120 100,200 L0,200 Z" fill="#3d0066"/>
                    <path d="M175,200 Q275,110 350,40 L350,200 Z" fill="#d8b4e2"/>
                    <path d="M210,200 Q290,130 350,60 L350,200 Z" fill="#7a288a"/>
                    <path d="M240,200 Q310,150 350,90 L350,200 Z" fill="#3d0066"/>
                </svg>
                <div class="card-inner-content back-layout">
                    <div class="p-meta">
                        <div class="p-name" id="lbl-name">RONY AHMED</div>
                        <div class="p-title" id="lbl-title">GRAPHIC DESIGNER</div>
                    </div>
                    
                    <div class="contact-list">
                        <div class="contact-row">
                            <div class="icon-holder">
                                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                            </div>
                            <div class="contact-val" id="lbl-phone">+88 0120 000 0000<br>+88 0120 000 0000</div>
                        </div>
                        <div class="contact-row">
                            <div class="icon-holder">
                                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            </div>
                            <div class="contact-val" id="lbl-email">www.yourgmailhere@gmail.com<br>www.yourgmailhere@gmail.com</div>
                        </div>
                        <div class="contact-row">
                            <div class="icon-holder">
                                <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.63 3.37 1.91 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.63-3.37-1.9-4.33-3.56zm2.95-8H5.08c.96-1.66 2.49-2.93 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .68-.07 1.34-.16 2zm.25 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.96 1.65-2.49 2.93-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                            </div>
                            <div class="contact-val" id="lbl-web">www.yourwebsitehere.com<br>www.yourwebsitehere.com</div>
                        </div>
                        <div class="contact-row">
                            <div class="icon-holder">
                                <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            </div>
                            <div class="contact-val" id="lbl-address">121 Parkview Street, Suite<br>200, California, USA</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-container">
        
        <div class="form-pane active" id="pane-front">
            <div class="field-group">
                <label>Logo Emblem Character</label>
                <input type="text" id="tx-logo" value="R" oninput="bindText('tx-logo', 'lbl-logo')" maxlength="2">
            </div>
            <div class="field-group">
                <label>Company Identity Title</label>
                <input type="text" id="tx-company" value="COMPANY NAME" oninput="bindText('tx-company', 'lbl-company')">
            </div>
            <div class="field-group">
                <label>Business Tagline</label>
                <input type="text" id="tx-tagline" value="YOUR TAG LINE HERE" oninput="bindText('tx-tagline', 'lbl-tagline')">
            </div>
        </div>

        <div class="form-pane" id="pane-back">
            <div class="field-group">
                <label>Cardholder Full Name</label>
                <input type="text" id="tx-name" value="RONY AHMED" oninput="bindText('tx-name', 'lbl-name')">
            </div>
            <div class="field-group">
                <label>Professional Assignment Title</label>
                <input type="text" id="tx-title" value="GRAPHIC DESIGNER" oninput="bindText('tx-title', 'lbl-title')">
            </div>
            <div class="field-group">
                <label>Telephone Values (Break line using &lt;br&gt;)</label>
                <input type="text" id="tx-phone" value="+88 0120 000 0000&lt;br&gt;+88 0120 000 0000" oninput="bindHTML('tx-phone', 'lbl-phone')">
            </div>
            <div class="field-group">
                <label>Mailing Addresses (Break line using &lt;br&gt;)</label>
                <input type="text" id="tx-email" value="www.yourgmailhere@gmail.com&lt;br&gt;www.yourgmailhere@gmail.com" oninput="bindHTML('tx-email', 'lbl-email')">
            </div>
            <div class="field-group">
                <label>Web URLs (Break line using &lt;br&gt;)</label>
                <input type="text" id="tx-web" value="www.yourwebsitehere.com&lt;br&gt;www.yourwebsitehere.com" oninput="bindHTML('tx-web', 'lbl-web')">
            </div>
            <div class="field-group">
                <label>Physical Workplace Location</label>
                <input type="text" id="tx-address" value="121 Parkview Street, Suite&lt;br&gt;200, California, USA" oninput="bindHTML('tx-address', 'lbl-address')">
            </div>
        </div>

        <button class="save-action-btn" onclick="executeCapture()">Save Active Layout</button>
    </div>

    <script>
        // Real-time text engine
        function bindText(sourceId, targetId) {
            document.getElementById(targetId).innerText = document.getElementById(sourceId).value;
        }

        function bindHTML(sourceId, targetId) {
            document.getElementById(targetId).innerHTML = document.getElementById(sourceId).value;
        }

        // Seamless mobile tab switcher
        function switchView(targetSide) {
            document.getElementById('btn-tab-front').classList.remove('active');
            document.getElementById('btn-tab-back').classList.remove('active');
            document.getElementById('view-front').classList.remove('active');
            document.getElementById('view-back').classList.remove('active');
            document.getElementById('pane-front').classList.remove('active');
            document.getElementById('pane-back').classList.remove('active');

            if(targetSide === 'front') {
                document.getElementById('btn-tab-front').classList.add('active');
                document.getElementById('view-front').classList.add('active');
                document.getElementById('pane-front').classList.add('active');
            } else {
                document.getElementById('btn-tab-back').classList.add('active');
                document.getElementById('view-back').classList.add('active');
                document.getElementById('pane-back').classList.add('active');
            }
            performScaleCheck();
        }

        // Automatic hardware matrix scaling fallback to fit tight mobile screens safely
        function performScaleCheck() {
            const container = document.getElementById('previewContainer');
            const targetWidth = 350;
            const targetHeight = 200;
            
            let safePaddingWidth = container.clientWidth - 30; 
            let scaleRatio = safePaddingWidth / targetWidth;

            // Restrict from scaling beyond 1:1 ratio
            if (scaleRatio > 1) scaleRatio = 1;

            const targetWrapper = document.getElementById('scalerBox');
            targetWrapper.style.height = (targetHeight * scaleRatio) + 'px';
            
            document.querySelectorAll('.bc-card').forEach(cardElement => {
                cardElement.style.transform = `scale(${scaleRatio})`;
            });
        }

        window.addEventListener('load', performScaleCheck);
        window.addEventListener('resize', performScaleCheck);

        // High-fidelity image capture engine
        function executeCapture() {
            const targetCard = document.querySelector('.bc-card.active');
            const nativeTransform = targetCard.style.transform;
            
            // Normalize layout boundaries prior to snapshot render
            targetCard.style.transform = 'scale(1)';
            
            html2canvas(targetCard, {
                scale: 6, // 6x structural scaling maps 350x200 canvas directly to print-quality 2100x1200 image asset
                useCORS: true,
                logging: false,
                backgroundColor: null
            }).then(generatedCanvas => {
                targetCard.style.transform = nativeTransform; // Return visual viewport scale

                const temporaryLink = document.createElement('a');
                temporaryLink.download = 'business_card_output.png';
                temporaryLink.href = generatedCanvas.toDataURL('image/png');
                temporaryLink.click();
            });
        }
    </script>
</body>
</html>
