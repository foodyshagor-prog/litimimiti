<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --dark-bg: linear-gradient(135deg, #13141c 0%, #292b3b 100%);
            --accent: #4ea538;
            --accent-dark: #3a8e31;
            --text-main: #ffffff;
            --text-muted: #a0a4bc;
            --card-width: 340px;
            --card-height: 194px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

        body, html {
            height: 100%;
            background: var(--dark-bg);
            color: var(--text-main);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        /* --- PREVIEW SECTION --- */
        .preview-section {
            flex: 0 0 auto;
            padding: 20px 10px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .toggle-switch {
            display: flex;
            background: #1a1c26;
            border-radius: 25px;
            margin-bottom: 15px;
            padding: 4px;
            width: 200px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 0;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 2px 8px rgba(78, 165, 56, 0.4);
        }

        .card-container {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            background: #ffffff;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
        }

        .card-face {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            display: none;
            background: #ffffff;
        }
        
        #view-front.active { 
            display: flex; 
            align-items: center;
            justify-content: center;
        }
        #view-back.active { display: block; }

        /* Full-size Card Background SVGs to fix html2canvas boundaries */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 340px;
            height: 194px;
            pointer-events: none;
            z-index: 1;
        }
        
        .front-content {
            position: relative;
            z-index: 5;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .logo-box {
            width: 44px; height: 44px;
            border: 3px solid #1a1e27;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            transform: rotate(30deg);
        }
        .logo-box svg {
            transform: rotate(-30deg);
        }

        .company-info { text-align: left; }
        .company-name { color: #1a1e27; font-size: 26px; font-weight: 800; letter-spacing: -0.5px; line-height: 1; }
        .company-slogan { color: #999; font-size: 8px; font-weight: 600; letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; }

        .back-content {
            position: absolute;
            top: 25px; left: 30px;
            z-index: 5;
        }
        .person-name { color: #666; font-size: 18px; font-weight: 300; }
        .person-name strong { color: #1a1e27; font-weight: 800; }
        .person-title { color: #3a8e31; font-size: 11px; font-weight: 600; margin-top: 2px; }

        .contact-list { margin-top: 15px; list-style: none; }
        .contact-item { display: flex; align-items: center; margin-bottom: 6px; font-size: 9px; color: #555; font-weight: 500; }
        .icon-circle {
            width: 18px; height: 18px;
            background: #1a1e27; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .icon-circle.green-bg { background: #4ea538; }

        /* --- EDITOR SECTION --- */
        .editor-section {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 25px 20px 90px 20px;
        }

        .editor-panel { display: none; animation: fadeIn 0.3s ease; }
        .editor-panel.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block; font-size: 12px; color: var(--text-muted);
            margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }
        .input-group input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 14px 15px; border-radius: 12px; font-size: 15px;
            transition: border 0.3s, box-shadow 0.3s; outline: none;
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(78, 165, 56, 0.2);
            background: rgba(0,0,0,0.5);
        }

        /* --- SAVE BUTTON --- */
        .save-btn-container {
            position: fixed; bottom: 0; left: 0; width: 100%;
            padding: 15px 20px;
            background: linear-gradient(to top, #13141c 60%, transparent);
            z-index: 100;
        }
        .btn-save {
            width: 100%; background: var(--accent); color: #fff;
            border: none; padding: 16px; border-radius: 14px;
            font-size: 16px; font-weight: bold; letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(78, 165, 56, 0.3);
            display: flex; align-items: center; justify-content: center; gap: 8px;
            cursor: pointer;
        }
        .btn-save:active { transform: scale(0.98); }
    </style>
</head>
<body>

<div class="app-container">
    
    <div class="preview-section">
        <div class="toggle-switch">
            <button class="toggle-btn active" onclick="switchTab('front', this)">Front Page</button>
            <button class="toggle-btn" onclick="switchTab('back', this)">Back Page</button>
        </div>

        <div class="card-container" id="card-capture-area">
            
            <div class="card-face active" id="view-front">
                <svg class="card-bg" width="340" height="194" viewBox="0 0 340 194" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(-20, -20) scale(1.8)">
                        <path fill="#dcf2d4" d="M0,0 L100,0 C80,30 50,60 0,90 Z" />
                        <path fill="#8cc977" d="M0,0 L70,0 C60,20 40,50 0,70 Z" />
                        <path fill="#4ea538" d="M0,0 L40,0 C30,30 20,40 0,60 Z" />
                    </g>
                    <g transform="translate(210, 74) scale(1.5)">
                        <path fill="#dcf2d4" d="M10,100 C30,70 70,50 100,50 L100,100 Z" />
                        <path fill="#8cc977" d="M30,100 C50,80 80,70 100,70 L100,100 Z" />
                    </g>
                </svg>

                <div class="front-content">
                    <div class="logo-box">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="#4ea538"><path d="M8 5v14l11-7z"/></svg>
                    </div>
                    <div class="company-info">
                        <div class="company-name" id="out-company">Media</div>
                        <div class="company-slogan" id="out-slogan">SLOGANHERE</div>
                    </div>
                </div>
            </div>

            <div class="card-face" id="view-back">
                <svg class="card-bg" width="340" height="194" viewBox="0 0 340 194" xmlns="http://www.w3.org/2000/svg">
                    <g transform="translate(-10, -10)">
                        <path fill="#dcf2d4" d="M0,0 L100,0 C70,20 30,30 0,40 Z" />
                        <path fill="#8cc977" d="M0,0 L60,0 C40,10 20,15 0,20 Z" />
                    </g>
                    <g transform="translate(190, 44) scale(1.8)">
                        <path fill="#dcf2d4" d="M0,100 C20,70 60,40 100,30 L100,100 Z" />
                        <path fill="#8cc977" d="M30,100 C50,80 70,60 100,50 L100,100 Z" />
                        <path fill="#4ea538" d="M50,100 C70,85 85,75 100,65 L100,100 Z" />
                    </g>
                </svg>

                <div class="back-content">
                    <div class="person-name"><strong id="out-fname">Mark</strong> <span id="out-lname">Harrison</span></div>
                    <div class="person-title" id="out-title">Graphic Designer</div>
                    
                    <ul class="contact-list">
                        <li class="contact-item">
                            <div class="icon-circle green-bg">
                                <svg viewBox="0 0 384 512" width="9" height="12" fill="#ffffff"><path d="M215.7 499.2C267 435 384 279.4 384 192C384 86 298 0 192 0S0 86 0 192c0 87.4 117 243 168.3 307.2c12.3 15.3 35.1 15.3 47.4 0zM192 128a64 64 0 1 1 0 128 64 64 0 1 1 0-128z"/></svg>
                            </div>
                            <span id="out-address">2088 Graphic Road<br>Lyon ,France 11425</span>
                        </li>
                        <li class="contact-item">
                            <div class="icon-circle">
                                <svg viewBox="0 0 512 512" width="10" height="10" fill="#ffffff"><path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4L236.8 313.6c11.4 8.5 27 8.5 38.4 0L492.8 150.4c12.1-9.1 19.2-23.3 19.2-38.4c0-26.5-21.5-48-48-48H48zM0 176V384c0 35.3 28.7 64 64 64H448c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z"/></svg>
                            </div>
                            <span id="out-email">MarkHarrison@lorem.com</span>
                        </li>
                        <li class="contact-item">
                            <div class="icon-circle green-bg">
                                <svg viewBox="0 0 512 512" width="9" height="9" fill="#ffffff"><path d="M164.9 24.6c-7.7-18.6-28-28.5-47.4-23.2l-88 24C12.1 30.2 0 46 0 64C0 311.4 200.6 512 448 512c18 0 33.8-12.1 38.6-29.5l24-88c5.3-19.4-4.6-39.7-23.2-47.4l-96-40c-16.3-6.8-35.2-2.1-46.3 11.6L304.7 368C234.3 334.7 177.3 277.7 144 207.3L193.3 167c13.7-11.2 18.4-30 11.6-46.3l-40-96z"/></svg>
                            </div>
                            <span id="out-phone">+18 9153 3990 0008</span>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-section">
        <div class="editor-panel active" id="edit-front">
            <div class="input-group">
                <label>Company Name</label>
                <input type="text" id="in-company" value="Media">
            </div>
            <div class="input-group">
                <label>Slogan</label>
                <input type="text" id="in-slogan" value="SLOGANHERE">
            </div>
        </div>

        <div class="editor-panel" id="edit-back">
            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex:1;">
                    <label>First Name</label>
                    <input type="text" id="in-fname" value="Mark">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Last Name</label>
                    <input type="text" id="in-lname" value="Harrison">
                </div>
            </div>
            <div class="input-group">
                <label>Job Title</label>
                <input type="text" id="in-title" value="Graphic Designer">
            </div>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="in-address" value="2088 Graphic Road, Lyon, France 11425">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="in-email" value="MarkHarrison@lorem.com">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="tel" id="in-phone" value="+18 9153 3990 0008">
            </div>
        </div>
    </div>

    <div class="save-btn-container">
        <button class="btn-save" onclick="saveImage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
            Save Combined Presentation Image
        </button>
    </div>

</div>

<script>
    // --- UI TOGGLE LOGIC ---
    function switchTab(tabName, btnElement) {
        document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
        if (btnElement) {
            btnElement.classList.add('active');
        }
        document.getElementById('view-front').classList.remove('active');
        document.getElementById('view-back').classList.remove('active');
        document.getElementById('view-' + tabName).classList.add('active');

        document.getElementById('edit-front').classList.remove('active');
        document.getElementById('edit-back').classList.remove('active');
        document.getElementById('edit-' + tabName).classList.add('active');
    }

    // --- REAL-TIME TEXT UPDATE LOGIC ---
    const bindInput = (inputId, outputId, isHTML = false) => {
        document.getElementById(inputId).addEventListener('input', function(e) {
            let val = e.target.value;
            if(inputId === 'in-address') {
                const parts = val.split(',');
                if(parts.length > 1) {
                    val = parts[0].trim() + '<br>' + parts.slice(1).join(',').trim();
                }
            }
            
            if(isHTML || inputId === 'in-address') {
                document.getElementById(outputId).innerHTML = val;
            } else {
                document.getElementById(outputId).innerText = val;
            }
        });
    };

    bindInput('in-company', 'out-company');
    bindInput('in-slogan', 'out-slogan');
    bindInput('in-fname', 'out-fname');
    bindInput('in-lname', 'out-lname');
    bindInput('in-title', 'out-title');
    bindInput('in-address', 'out-address');
    bindInput('in-email', 'out-email');
    bindInput('in-phone', 'out-phone');

    // --- SAVE IMAGE LOGIC ---
    function saveImage() {
        const btn = document.querySelector('.btn-save');
        const originalContent = btn.innerHTML;
        btn.innerText = "Processing...";
        btn.style.opacity = "0.6";
        btn.style.pointerEvents = "none";

        // Setup clean presentation rendering wrapper
        const renderContainer = document.createElement('div');
        renderContainer.style.position = 'fixed';
        renderContainer.style.top = '0';
        renderContainer.style.left = '0'; 
        renderContainer.style.zIndex = '-9999'; 
        renderContainer.style.width = '420px';  
        renderContainer.style.backgroundColor = '#f0f2f5'; 
        renderContainer.style.padding = '40px 0'; 
        renderContainer.style.display = 'flex';
        renderContainer.style.flexDirection = 'column';
        renderContainer.style.alignItems = 'center';
        renderContainer.style.gap = '30px'; 
        renderContainer.style.boxSizing = 'border-box';

        // Prepare Front Clone
        const frontCardWrapper = document.createElement('div');
        frontCardWrapper.className = 'card-container';
        frontCardWrapper.style.boxShadow = '0 6px 15px rgba(0,0,0,0.08)';
        frontCardWrapper.style.width = '340px'; 
        frontCardWrapper.style.height = '194px';
        
        const frontFaceClone = document.getElementById('view-front').cloneNode(true);
        frontFaceClone.removeAttribute('id'); 
        frontFaceClone.style.display = 'flex';
        frontFaceClone.style.position = 'relative';
        frontCardWrapper.appendChild(frontFaceClone);

        // Prepare Back Clone
        const backCardWrapper = document.createElement('div');
        backCardWrapper.className = 'card-container';
        backCardWrapper.style.boxShadow = '0 6px 15px rgba(0,0,0,0.08)';
        backCardWrapper.style.width = '340px'; 
        backCardWrapper.style.height = '194px';
        
        const backFaceClone = document.getElementById('view-back').cloneNode(true);
        backFaceClone.removeAttribute('id'); 
        backFaceClone.style.display = 'block';
        backFaceClone.style.position = 'relative';
        backCardWrapper.appendChild(backFaceClone);

        renderContainer.appendChild(frontCardWrapper);
        renderContainer.appendChild(backCardWrapper);
        document.body.appendChild(renderContainer);

        html2canvas(renderContainer, {
            scale: 3, 
            backgroundColor: '#f0f2f5', 
            logging: false,
            useCORS: true,
            allowTaint: true
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'business_card_vertical_presentation.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            document.body.removeChild(renderContainer);
            btn.innerHTML = originalContent;
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
        }).catch(err => {
            console.error("Save generation failed:", err);
            if(document.body.contains(renderContainer)) {
                document.body.removeChild(renderContainer);
            }
            btn.innerHTML = originalContent;
            btn.style.opacity = "1";
            btn.style.pointerEvents = "auto";
        });
    }
</script>

</body>
</html>
