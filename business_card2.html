<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --gold-grad: linear-gradient(45deg, #A67C00 0%, #BF953F 14%, #FCF6BA 45%, #B38728 75%, #FBF5B7 100%);
            --card-bg: #050505;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            height: 100vh;
            overflow: hidden;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 1.5rem;
            color: #e0e0e0;
            flex-shrink: 0;
        }

        /* VIEW SWITCHER TABS */
        .mode-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }

        .mode-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            color: #aaa;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .mode-btn.active {
            background: var(--gold-grad);
            color: #000;
        }

        /* Card Preview Container */
        .preview-wrapper {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            flex-shrink: 0;
            z-index: 10;
        }

        /* Combined Layout Container */
        .cards-combined-container {
            display: flex;
            flex-direction: column;
            gap: 0px;
        }

        /* Live Browser Preview Tab Controllers */
        .preview-wrapper.show-front .back-card { display: none !important; }
        .preview-wrapper.show-back .front-card { display: none !important; }

        /* SMOOTH SCROLL CONTAINER */
        .scroll-container {
            flex: 1;
            overflow-y: auto;
            padding-top: 15px;
            padding-right: 5px;
            -webkit-overflow-scrolling: touch;
        }

        .scroll-container::-webkit-scrollbar {
            width: 6px;
        }
        .scroll-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        .card {
            width: 350px;
            height: 200px;
            background: var(--card-bg);
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .gold-text {
            background: var(--gold-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #BF953F;
            display: inline-block;
        }

        /* FRONT CARD DESIGN */
        .front-card {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding-left: 45px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .butterfly-icon svg {
            width: 48px;
            height: 48px;
            display: block;
        }

        .logo-text {
            font-family: 'Great Vibes', cursive;
            font-size: 2.8rem;
            line-height: 0.8;
            display: flex;
            flex-direction: column;
        }

        .logo-text span:nth-child(2) {
            margin-left: 20px;
        }

        .shape-1 {
            position: absolute;
            right: -60px;
            top: -50px;
            width: 140px;
            height: 300px;
            background: var(--gold-grad);
            transform: rotate(30deg);
            z-index: 1;
        }
        .shape-2 {
            position: absolute;
            right: 40px;
            bottom: -60px;
            width: 50px;
            height: 150px;
            background: var(--gold-grad);
            transform: rotate(30deg);
            z-index: 1;
        }

        /* BACK CARD DESIGN */
        .back-card {
            display: flex;
        }

        .back-left {
            width: 40%;
            padding: 15px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            text-align: center;
            z-index: 2;
        }

        .profile-img-preview {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            border: 1.5px solid #BF953F;
            margin-bottom: 5px;
            background: rgba(255, 255, 255, 0.1);
        }

        .name {
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .title {
            color: #fff;
            font-size: 0.55rem;
            font-weight: 400;
        }

        .small-logo {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }
        .small-logo svg {
            width: 22px;
            height: 22px;
        }
        .small-logo .logo-text {
            font-size: 1.4rem;
        }

        .back-divider {
            position: absolute;
            left: 42%;
            top: -20px;
            width: 25px;
            height: 240px;
            background: var(--gold-grad);
            transform: rotate(15deg);
            z-index: 1;
        }

        .back-right {
            width: 60%;
            padding: 25px 15px 20px 35px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .services-list {
            list-style: none;
            margin-bottom: 15px;
        }

        .services-list li {
            color: #fff;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .services-list li::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--gold-grad);
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.7rem;
        }
        
        .contact-icon {
            width: 14px;
            height: 14px;
            display: inline-block;
        }

        /* Save Button */
        .btn-save {
            width: 100%;
            padding: 15px;
            margin-bottom: 25px;
            border: none;
            border-radius: 10px;
            background: var(--gold-grad);
            color: #000;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(191, 149, 63, 0.4);
        }

        /* Form Styles */
        .editor-form {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            color: #aaa;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 0.9rem;
        }

        .input-group input[type="file"] {
            padding: 7px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #BF953F;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <h2>Card Editor</h2>
        
        <div class="mode-switcher">
            <button id="btn-front" class="mode-btn active" onclick="switchMode('front')">Front Side</button>
            <button id="btn-back" class="mode-btn" onclick="switchMode('back')">Back Side</button>
        </div>
        
        <div class="preview-wrapper show-front" id="card-capture-area">

            <div class="cards-combined-container" id="cards-combined-container">
                
                <div class="card front-card">
                    <div class="shape-1"></div>
                    <div class="shape-2"></div>
                    <div class="logo-container">
                        <div class="butterfly-icon">
                            <svg viewBox="0 0 24 24">
                                <defs>
                                    <linearGradient id="goldIconGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
                                        <stop offset="0%" stop-color="#A67C00" />
                                        <stop offset="14%" stop-color="#BF953F" />
                                        <stop offset="45%" stop-color="#FCF6BA" />
                                        <stop offset="75%" stop-color="#B38728" />
                                        <stop offset="100%" stop-color="#FBF5B7" />
                                    </linearGradient>
                                </defs>
                                <path fill="url(#goldIconGradFront)" d="M12 2c-.5 0-1 .5-1 1v18c0 .5.5 1 1 1s1-.5 1-1V3c0-.5-.5-1-1-1zM4.5 5.5C3.1 6.9 2 8.8 2 11c0 3.3 2.7 6 6 6 1.7 0 3.2-.7 4-1.8V7.3C11.2 5.3 9 4 6.5 4c-1 0-1.8.5-2 1.5zM19.5 5.5c-1.4-1.4-3.5-2.2-6-2.2v10.8c.8 1.1 2.3 1.8 4 1.8 3.3 0 6-2.7 6-6 0-2.2-1.1-4.1-2.5-5.5z"/>
                            </svg>
                        </div>
                        <div class="logo-text gold-text">
                            <span id="out-logo1">Posh</span>
                            <span id="out-logo2">Fairy</span>
                        </div>
                    </div>
                </div>

                <div class="card back-card">
                    <div class="back-divider"></div>
                    
                    <div class="back-left">
                        <div class="user-profile">
                            <img id="out-profile-img" class="profile-img-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'><path d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 1.79zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5-3-8-3z'/></svg>" alt="Profile">
                            <div class="name" id="out-name">AYOMIPO G. ADESIYUN</div>
                            <div class="title" id="out-title">CEO</div>
                        </div>
                        
                        <div class="small-logo">
                            <div class="butterfly-icon">
                                <svg viewBox="0 0 24 24">
                                    <defs>
                                        <linearGradient id="goldIconGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#A67C00" />
                                            <stop offset="14%" stop-color="#BF953F" />
                                            <stop offset="45%" stop-color="#FCF6BA" />
                                            <stop offset="75%" stop-color="#B38728" />
                                            <stop offset="100%" stop-color="#FBF5B7" />
                                        </linearGradient>
                                    </defs>
                                    <path fill="url(#goldIconGradBack)" d="M12 2c-.5 0-1 .5-1 1v18c0 .5.5 1 1 1s1-.5 1-1V3c0-.5-.5-1-1-1zM4.5 5.5C3.1 6.9 2 8.8 2 11c0 3.3 2.7 6 6 6 1.7 0 3.2-.7 4-1.8V7.3C11.2 5.3 9 4 6.5 4c-1 0-1.8.5-2 1.5zM19.5 5.5c-1.4-1.4-3.5-2.2-6-2.2v10.8c.8 1.1 2.3 1.8 4 1.8 3.3 0 6-2.7 6-6 0-2.2-1.1-4.1-2.5-5.5z"/>
                                </svg>
                            </div>
                            <div class="logo-text gold-text">
                                <span id="out-back-logo1">Posh</span>
                                <span id="out-back-logo2">Fairy</span>
                            </div>
                        </div>
                    </div>

                    <div class="back-right">
                        <ul class="services-list">
                            <li id="out-s1">Image Consulting</li>
                            <li id="out-s2">Personal Branding</li>
                            <li id="out-s3">Business Logistics</li>
                            <li>Personal Styling</li>
                            <li>Trainings</li>
                        </ul>

                        <div class="contact-info">
                            <div class="contact-item">
                                <svg class="contact-icon" viewBox="0 0 448 512">
                                    <defs>
                                        <linearGradient id="goldIconPhone" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#A67C00" /><stop offset="100%" stop-color="#FBF5B7" />
                                        </linearGradient>
                                    </defs>
                                    <path fill="url(#goldIconPhone)" d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3L72 359.2l-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7 .9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"/>
                                </svg>
                                <span class="gold-text" id="out-phone">0803 918 0747</span>
                            </div>
                            <div class="contact-item">
                                <svg class="contact-icon" viewBox="0 0 448 512">
                                    <defs>
                                        <linearGradient id="goldIconIg" x1="0%" y1="0%" x2="100%" y2="100%">
                                            <stop offset="0%" stop-color="#A67C00" /><stop offset="100%" stop-color="#FBF5B7" />
                                        </linearGradient>
                                    </defs>
                                    <path fill="url(#goldIconIg)" d="M224.1 141c-63.6 0-114.9 51.3-114.9 114.9s51.3 114.9 114.9 114.9S339 319.5 339 255.9 287.7 141 224.1 141zm0 189.6c-41.1 0-74.7-33.5-74.7-74.7s33.5-74.7 74.7-74.7 74.7 33.5 74.7 74.7-33.6 74.7-74.7 74.7zm146.4-194.3c0 14.9-12 26.8-26.8 26.8-14.9 0-26.8-12-26.8-26.8s12-26.8 26.8-26.8 26.8 12 26.8 26.8zm76.1 27.2c-1.7-35.9-9.9-67.7-36.2-93.9-26.2-26.2-58-34.4-93.9-36.2-37-2.1-147.9-2.1-184.9 0-35.8 1.7-67.6 9.9-93.9 36.1s-34.4 58-36.2 93.9c-2.1 37-2.1 147.9 0 184.9 1.7 35.9 9.9 67.7 36.2 93.9s58 34.4 93.9 36.2c37 2.1 147.9 2.1 184.9 0 35.9-1.7 67.7-9.9 93.9-36.2 26.2-26.2 34.4-58 36.2-93.9 2.1-37 2.1-147.8 0-184.8zM402.4 377.3c-7.8 19.6-22.9 34.7-42.6 42.6-29.5 11.7-99.5 9-135.8 9s-106.3 2.6-135.8-9c-19.6-7.8-34.7-22.9-42.6-42.6-11.7-29.5-9-99.5-9-135.8s-2.6-106.3 9-135.8c7.8-19.6 22.9-34.7 42.6-42.6 29.5-11.7 99.5-9 135.8-9s106.3-2.6 135.8 9c19.6 7.8 34.7 22.9 42.6 42.6 11.7 29.5 9 99.5 9 135.8s2.7 106.3-9 135.8z"/>
                                </svg>
                                <span class="gold-text" id="out-ig">@image.by.poshfairy</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="scroll-container">
            <button class="btn-save" onclick="saveCombinedImage()">Save Both Sides (Single Image)</button>

            <div class="editor-form">
                <div class="input-group">
                    <label>Profile Image</label>
                    <input type="file" id="inp-img" accept="image/*" onchange="updateProfileImage(this)">
                </div>
                <div class="input-group">
                    <label>Brand Text Line 1</label>
                    <input type="text" id="inp-logo1" value="Posh" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Brand Text Line 2</label>
                    <input type="text" id="inp-logo2" value="Fairy" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="inp-name" value="AYOMIPO G. ADESIYUN" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Job Title</label>
                    <input type="text" id="inp-title" value="CEO" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Service 1</label>
                    <input type="text" id="inp-s1" value="Image Consulting" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Service 2</label>
                    <input type="text" id="inp-s2" value="Personal Branding" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Service 3</label>
                    <input type="text" id="inp-s3" value="Business Logistics" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Phone Number</label>
                    <input type="text" id="inp-phone" value="0803 918 0747" onkeyup="updateCard()">
                </div>
                <div class="input-group">
                    <label>Instagram Handle</label>
                    <input type="text" id="inp-ig" value="@image.by.poshfairy" onkeyup="updateCard()">
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'front';

        function switchMode(mode) {
            currentMode = mode;
            const previewWrapper = document.getElementById('card-capture-area');
            const btnFront = document.getElementById('btn-front');
            const btnBack = document.getElementById('btn-back');

            if (mode === 'front') {
                previewWrapper.className = "preview-wrapper show-front";
                btnFront.classList.add('active');
                btnBack.classList.remove('active');
            } else {
                previewWrapper.className = "preview-wrapper show-back";
                btnBack.classList.add('active');
                btnFront.classList.remove('active');
            }
        }

        function updateCard() {
            const l1 = document.getElementById('inp-logo1').value;
            const l2 = document.getElementById('inp-logo2').value;
            document.getElementById('out-logo1').innerText = l1;
            document.getElementById('out-back-logo1').innerText = l1;
            document.getElementById('out-logo2').innerText = l2;
            document.getElementById('out-back-logo2').innerText = l2;

            document.getElementById('out-name').innerText = document.getElementById('inp-name').value;
            document.getElementById('out-title').innerText = document.getElementById('inp-title').value;
            document.getElementById('out-s1').innerText = document.getElementById('inp-s1').value;
            document.getElementById('out-s2').innerText = document.getElementById('inp-s2').value;
            document.getElementById('out-s3').innerText = document.getElementById('inp-s3').value;
            document.getElementById('out-phone').innerText = document.getElementById('inp-phone').value;
            document.getElementById('out-ig').innerText = document.getElementById('inp-ig').value;
        }

        function updateProfileImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('out-profile-img').src = e.target.result;
                }
                reader.readAsDataURL(input.files[0]);
            }
        }

        // DUAL CARD GENERATOR ENGINE
        function saveCombinedImage() {
            const captureArea = document.getElementById('card-capture-area');
            const button = document.querySelector('.btn-save');
            
            button.innerText = "Generating Image...";
            
            html2canvas(captureArea, { 
                scale: 3, 
                backgroundColor: "#ffffff",
                useCORS: true,
                onclone: (clonedDoc) => {
                    // 1. STRIP VISIBILITY RESTRICTIONS: Remove restricting display toggles entirely
                    const targetWrapper = clonedDoc.getElementById('card-capture-area');
                    targetWrapper.classList.remove('show-front', 'show-back');
                    targetWrapper.style.padding = '35px';
                    
                    // 2. LAYOUT FORCE ENGINE: Stack cards vertically with clean white space separation
                    const container = clonedDoc.getElementById('cards-combined-container');
                    container.style.display = 'flex';
                    container.style.flexDirection = 'column';
                    container.style.gap = '35px';
                    
                    const frontSide = clonedDoc.querySelector('.front-card');
                    const backSide = clonedDoc.querySelector('.back-card');
                    
                    if(frontSide) frontSide.style.setProperty('display', 'flex', 'important');
                    if(backSide) backSide.style.setProperty('display', 'flex', 'important');

                    // 3. TEXT GRADIENT BOX WORKAROUND: Force clean luxury gold text rendering inside canvas
                    clonedDoc.querySelectorAll('.gold-text').forEach(el => {
                        el.style.background = 'none';
                        el.style.webkitBackgroundClip = 'initial';
                        el.style.webkitTextFillColor = '#BF953F';
                        el.style.color = '#BF953F';
                    });
                }
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `combined_business_cards.png`;
                link.href = canvas.toDataURL('image/png', 1.0);
                link.click();
                
                button.innerText = "Save Both Sides (Single Image)";
            }).catch(err => {
                console.error("Canvas Export Failed: ", err);
                button.innerText = "Save Both Sides (Single Image)";
            });
        }
    </script>

</body>
</html>
