<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --primary-dark: #0f172a;
            --secondary-dark: #1e293b;
            --accent: #d81b60;
            --text-light: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--secondary-dark) 100%);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- UI Layout --- */
        .preview-section {
            flex: 0 0 auto;
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            z-index: 10;
        }

        .switch-container {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 15px;
            width: 80%;
            max-width: 300px;
        }

        .switch-btn {
            flex: 1;
            padding: 8px 15px;
            border: none;
            background: transparent;
            color: var(--text-light);
            border-radius: 20px;
            font-family: inherit;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .switch-btn.active {
            background: linear-gradient(45deg, #8e24aa, #e91e63);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(233, 30, 99, 0.4);
        }

        .preview-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            height: 220px; /* Adjusted dynamically via JS */
        }

        .editor-section {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* --- Form Inputs --- */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.25);
            color: white;
            font-family: inherit;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        .save-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #8e24aa, #e91e63);
            color: white;
            font-size: 16px;
            font-weight: 600;
            font-family: inherit;
            margin-top: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(233, 30, 99, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .save-btn:active {
            transform: scale(0.98);
        }

        /* --- Business Card Design (Exact Match) --- */
        .card {
            width: 600px;
            height: 342px; /* 1.75 Aspect Ratio */
            background: white;
            position: absolute;
            transform-origin: top center;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: none; /* Toggled via JS */
        }

        .card.active {
            display: block;
        }

        /* Abstract Circles */
        .circle { position: absolute; border-radius: 50%; }
        
        /* Front Card Elements */
        .f-c1 { width: 300px; height: 300px; background: #9c27b0; left: -100px; top: -80px; opacity: 0.85; }
        .f-c2 { width: 350px; height: 350px; background: #ab47bc; left: -180px; bottom: -100px; opacity: 0.9; }
        .f-c3 { width: 250px; height: 250px; background: #e91e63; left: -20px; bottom: -120px; opacity: 0.8; }
        .f-c4 { width: 220px; height: 220px; border: 2px solid rgba(255,255,255,0.4); left: 20px; bottom: -50px; }
        .f-c5 { width: 180px; height: 180px; background: #8e24aa; left: 180px; bottom: -90px; opacity: 0.9; }
        .f-c6 { width: 190px; height: 190px; border: 2px solid rgba(233, 30, 99, 0.4); left: 160px; bottom: -80px; }
        .f-c7 { width: 60px; height: 60px; background: #f06292; left: 320px; bottom: 20px; opacity: 0.8; }
        .f-c8 { width: 20px; height: 20px; background: #e91e63; left: 260px; top: 100px; }
        .f-c9 { width: 15px; height: 15px; background: #ab47bc; left: 210px; top: 130px; }

        .logo-container {
            position: absolute;
            top: 50px;
            right: 60px;
            text-align: center;
        }

        .logo-icon {
            color: #ab47bc;
            font-size: 32px;
            margin-bottom: 5px;
        }

        .company-name {
            font-family: 'Great Vibes', cursive;
            font-size: 42px;
            color: #9e9e9e;
            line-height: 1;
        }

        /* Back Card Elements */
        .b-name-container {
            position: absolute;
            top: 60px;
            left: 60px;
        }
        
        .b-name {
            font-size: 38px;
            color: #757575;
            letter-spacing: -1px;
            display: flex;
        }
        .b-name span:first-child { font-weight: 300; }
        .b-name span:last-child { font-weight: 500; }
        
        .b-title {
            font-size: 18px;
            color: #ab47bc;
            font-weight: 300;
            margin-top: -5px;
        }

        .b-contact-container {
            position: absolute;
            bottom: 60px;
            left: 60px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #9e9e9e;
            font-size: 14px;
        }

        .icon-circle {
            width: 24px;
            height: 24px;
            background: #ab47bc;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 12px;
        }

        .b-c1 { width: 300px; height: 300px; background: #e91e63; right: -100px; bottom: -120px; opacity: 0.8; }
        .b-c2 { width: 320px; height: 320px; border: 2px solid rgba(233, 30, 99, 0.4); right: -110px; bottom: -110px; }
        .b-c3 { width: 180px; height: 180px; background: #8e24aa; right: 20px; bottom: 20px; opacity: 0.85; }
        .b-c4 { width: 190px; height: 190px; border: 2px solid rgba(142, 36, 170, 0.4); right: 10px; bottom: 10px; }
        .b-c5 { width: 30px; height: 30px; background: #e91e63; right: 180px; bottom: 80px; }
        
        .b-logo-container {
            position: absolute;
            bottom: 30px;
            right: 40px;
            text-align: center;
            z-index: 5;
        }
        
        .b-logo-icon { color: rgba(255,255,255,0.7); font-size: 18px; }
        .b-company-name { font-family: 'Great Vibes', cursive; font-size: 24px; color: rgba(255,255,255,0.8); }

    </style>
</head>
<body>

    <div class="preview-section">
        <div class="switch-container">
            <button class="switch-btn active" onclick="switchCard('front')">Front Side</button>
            <button class="switch-btn" onclick="switchCard('back')">Back Side</button>
        </div>
        
        <div class="preview-wrapper" id="preview-wrapper">
            
            <div class="card active" id="card-front">
                <div class="circle f-c1"></div>
                <div class="circle f-c2"></div>
                <div class="circle f-c3"></div>
                <div class="circle f-c4"></div>
                <div class="circle f-c5"></div>
                <div class="circle f-c6"></div>
                <div class="circle f-c7"></div>
                <div class="circle f-c8"></div>
                <div class="circle f-c9"></div>
                
                <div class="logo-container">
                    <i class="fas fa-seedling logo-icon"></i>
                    <div class="company-name" id="disp-company-front">Company</div>
                </div>
            </div>

            <div class="card" id="card-back">
                <div class="b-name-container">
                    <div class="b-name"><span id="disp-fname">Sara</span><span id="disp-lname">Smith</span></div>
                    <div class="b-title" id="disp-title">Partner Business</div>
                </div>

                <div class="b-contact-container">
                    <div class="contact-item">
                        <div class="icon-circle"><i class="fas fa-mobile-alt"></i></div>
                        <span id="disp-phone">123 456 789</span>
                    </div>
                    <div class="contact-item">
                        <div class="icon-circle"><i class="fab fa-facebook-f"></i></div>
                        <span id="disp-fb">Sara Smith</span>
                    </div>
                    <div class="contact-item">
                        <div class="icon-circle"><i class="fab fa-twitter"></i></div>
                        <span id="disp-tw">#SaraSmith</span>
                    </div>
                </div>

                <div class="circle b-c1"></div>
                <div class="circle b-c2"></div>
                <div class="circle b-c3"></div>
                <div class="circle b-c4"></div>
                <div class="circle b-c5"></div>

                <div class="b-logo-container">
                    <i class="fas fa-seedling b-logo-icon"></i>
                    <div class="b-company-name" id="disp-company-back">Company</div>
                </div>
            </div>
            
        </div>
    </div>

    <div class="editor-section">
        <div class="input-group">
            <label>Company Name</label>
            <input type="text" id="inp-company" value="Company" oninput="updateText('disp-company-front', this.value); updateText('disp-company-back', this.value);">
        </div>
        
        <div class="input-group" style="display: flex; gap: 10px;">
            <div style="flex: 1;">
                <label>First Name</label>
                <input type="text" id="inp-fname" value="Sara" oninput="updateText('disp-fname', this.value);">
            </div>
            <div style="flex: 1;">
                <label>Last Name</label>
                <input type="text" id="inp-lname" value="Smith" oninput="updateText('disp-lname', this.value);">
            </div>
        </div>

        <div class="input-group">
            <label>Job Title</label>
            <input type="text" id="inp-title" value="Partner Business" oninput="updateText('disp-title', this.value);">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="inp-phone" value="123 456 789" oninput="updateText('disp-phone', this.value);">
        </div>

        <div class="input-group">
            <label>Facebook Handle</label>
            <input type="text" id="inp-fb" value="Sara Smith" oninput="updateText('disp-fb', this.value);">
        </div>

        <div class="input-group">
            <label>Twitter Handle</label>
            <input type="text" id="inp-tw" value="#SaraSmith" oninput="updateText('disp-tw', this.value);">
        </div>

        <button class="save-btn" onclick="saveImage()">
            <i class="fas fa-download"></i> Save Visible Page
        </button>
    </div>

    <script>
        // Adjust scale so the 600px card fits perfectly on any mobile screen
        function resizeCard() {
            const wrapper = document.getElementById('preview-wrapper');
            const availableWidth = window.innerWidth * 0.9; // 90% of screen width
            const scale = availableWidth / 600;
            
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.transform = `scale(${scale})`;
            });
            
            // Adjust wrapper height to match scaled card so it doesn't leave huge gaps
            wrapper.style.height = `${342 * scale}px`;
        }

        window.addEventListener('resize', resizeCard);
        window.addEventListener('DOMContentLoaded', resizeCard);

        // Update DOM elements on input
        function updateText(id, value) {
            document.getElementById(id).innerText = value || ' '; 
        }

        // Switch between front and back
        function switchCard(side) {
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            
            if(side === 'front') {
                document.querySelector('.switch-btn:nth-child(1)').classList.add('active');
                document.getElementById('card-front').classList.add('active');
            } else {
                document.querySelector('.switch-btn:nth-child(2)').classList.add('active');
                document.getElementById('card-back').classList.add('active');
            }
        }

        // Save functionality using html2canvas
        function saveImage() {
            // Find the currently active card
            const activeCard = document.querySelector('.card.active');
            const originalTransform = activeCard.style.transform;
            
            // Temporarily remove scaling so html2canvas captures full 600x342 high-res resolution
            activeCard.style.transform = 'scale(1)';
            
            html2canvas(activeCard, {
                scale: 3, // Multiplies resolution by 3 for an ultra-HD crisp export
                useCORS: true,
                backgroundColor: null // Transparent behind the card bounds
            }).then(canvas => {
                const base64Image = canvas.toDataURL("image/png");
                
                // --- ANDROID WEBVIEW INTEGRATION ---
                // If you are using Jetpack Compose/Kotlin, you can catch this via a JavascriptInterface.
                // Example: AndroidAppBridge.saveBase64Image(base64Image)
                
                if (window.AndroidBridge) {
                    window.AndroidBridge.saveImage(base64Image);
                } else {
                    // Fallback for standard browser testing
                    let link = document.createElement('a');
                    link.download = 'business_card.png';
                    link.href = base64Image;
                    link.click();
                }

                // Restore original mobile scale
                activeCard.style.transform = originalTransform;
            });
        }
    </script>
</body>
</html>
