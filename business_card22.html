<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --ui-bg-1: #0f172a;
            --ui-bg-2: #1e293b;
            --accent: #8ea1ff;
            --text-light: #f8fafc;
            --card-width: 800px;
            --card-height: 450px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--ui-bg-1), var(--ui-bg-2));
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- Tool UI (Mobile Focused Dark Gradient) --- */
        .preview-section {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .tab-switcher {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 30px;
            padding: 4px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 300px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            font-weight: 600;
            border-radius: 26px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 14px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #ff8efb, #7ba0ff);
            color: white;
            box-shadow: 0 4px 10px rgba(123, 160, 255, 0.3);
        }

        .preview-container {
            width: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        /* --- Actual Business Card Styling (Exactly like image) --- */
        .card-wrapper {
            width: var(--card-width);
            height: var(--card-height);
            background: #ffffff;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            color: #8da1b5; /* Base text color for the card */
            display: none; /* Hidden by default, toggled via JS */
        }

        .card-wrapper.active {
            display: block;
        }

        /* Card Graphic Elements */
        .shape {
            position: absolute;
            background: linear-gradient(135deg, #ff9df8, #8ea1ff);
            border-radius: 45px;
            transform: rotate(45deg);
            opacity: 0.8;
        }

        /* Front Page Shapes */
        .front .shape-1 { width: 350px; height: 350px; top: -180px; right: -80px; }
        .front .shape-2 { width: 180px; height: 180px; bottom: 40px; left: 180px; border-radius: 30px; }
        .front .shape-3 { width: 220px; height: 220px; bottom: -80px; left: -80px; }
        .front .shape-4 { width: 120px; height: 120px; top: 120px; left: -60px; border-radius: 20px;}

        /* Back Page Shapes */
        .back .shape-1 { width: 450px; height: 450px; top: -50px; right: -180px; }
        .back .shape-2 { width: 150px; height: 150px; top: -80px; left: 40%; border-radius: 30px;}
        .back .shape-3 { width: 180px; height: 180px; bottom: -60px; right: 280px; border-radius: 30px;}
        .back .shape-4 { width: 250px; height: 250px; bottom: -120px; right: -40px; }

        /* Card Content Layout */
        .front-content {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 10;
        }

        .back-content {
            width: 100%;
            height: 100%;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .logo-svg {
            margin-bottom: 20px;
        }

        .company-name {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #9eb1c7;
            text-transform: uppercase;
        }

        .person-name {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #9eb1c7;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .person-position {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 4px;
            color: #cbd5e1;
            text-transform: uppercase;
            margin-bottom: 40px;
        }

        .contact-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .contact-icon {
            width: 24px;
            height: 24px;
            fill: #9eb1c7;
        }

        .address-block {
            font-size: 12px;
            color: #64748b;
            line-height: 1.6;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* --- Editor Panel --- */
        .editor-section {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        .form-group input:focus {
            border-color: var(--accent);
        }

        .btn-save {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #ff8efb, #7ba0ff);
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 30px;
            box-shadow: 0 8px 20px rgba(123, 160, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-save:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="preview-section">
        <div class="tab-switcher">
            <button class="tab-btn active" onclick="switchTab('front')">Front</button>
            <button class="tab-btn" onclick="switchTab('back')">Back</button>
        </div>
        
        <div class="preview-container" id="preview-box">
            
            <div class="card-wrapper front active" id="card-front">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>
                
                <div class="front-content">
                    <svg class="logo-svg" viewBox="0 0 100 100" width="80" height="80">
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7ba0ff" />
                                <stop offset="100%" stop-color="#ff8efb" />
                            </linearGradient>
                        </defs>
                        <rect x="20" y="20" width="40" height="40" rx="10" transform="rotate(45 40 40)" fill="none" stroke="url(#grad)" stroke-width="8" />
                        <rect x="40" y="20" width="40" height="40" rx="10" transform="rotate(45 60 40)" fill="none" stroke="url(#grad)" stroke-width="8" />
                    </svg>
                    <div class="company-name" id="disp-company">COMPANY NAME</div>
                </div>
            </div>

            <div class="card-wrapper back" id="card-back">
                <div class="shape shape-1"></div>
                <div class="shape shape-2"></div>
                <div class="shape shape-3"></div>
                <div class="shape shape-4"></div>

                <div class="back-content">
                    <svg class="logo-svg" viewBox="0 0 100 100" width="60" height="60">
                        <rect x="20" y="20" width="40" height="40" rx="10" transform="rotate(45 40 40)" fill="none" stroke="url(#grad)" stroke-width="8" />
                        <rect x="40" y="20" width="40" height="40" rx="10" transform="rotate(45 60 40)" fill="none" stroke="url(#grad)" stroke-width="8" />
                    </svg>
                    
                    <div class="person-name" id="disp-name">NAME SURNAME</div>
                    <div class="person-position" id="disp-position">POSITION</div>

                    <ul class="contact-list">
                        <li class="contact-item">
                            <svg class="contact-icon" viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.4-.5-3.6 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1zM19 12h2a9 9 0 0 0-9-9v2c3.9 0 7.1 3.2 7.1 7.1zM15 12h2c0-2.8-2.2-5-5-5v2c1.7 0 3.1 1.4 3.1 3.1z"/></svg>
                            <span id="disp-phone">+00-0000-0000-000</span>
                        </li>
                        <li class="contact-item">
                            <svg class="contact-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <span id="disp-email">INFO@COMPANYNAME.COM</span>
                        </li>
                        <li class="contact-item">
                            <svg class="contact-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            <span id="disp-web">WWW.COMPANYNAME.COM</span>
                        </li>
                    </ul>

                    <div class="address-block">
                        <div id="disp-address1">1234 YOUR LOCATION HERE</div>
                        <div id="disp-address2">YOUR RD, YOUR STREET</div>
                        <div id="disp-address3">POSTAL 00000</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-section">
        
        <div id="inputs-front">
            <div class="form-group">
                <label>Company Name</label>
                <input type="text" id="inp-company" value="COMPANY NAME" oninput="updateField('company', this.value)">
            </div>
        </div>

        <div id="inputs-back" style="display: none;">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="inp-name" value="NAME SURNAME" oninput="updateField('name', this.value)">
            </div>
            <div class="form-group">
                <label>Job Position</label>
                <input type="text" id="inp-position" value="POSITION" oninput="updateField('position', this.value)">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="inp-phone" value="+00-0000-0000-000" oninput="updateField('phone', this.value)">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="inp-email" value="INFO@COMPANYNAME.COM" oninput="updateField('email', this.value)">
            </div>
            <div class="form-group">
                <label>Website</label>
                <input type="text" id="inp-web" value="WWW.COMPANYNAME.COM" oninput="updateField('web', this.value)">
            </div>
            <div class="form-group">
                <label>Address Line 1</label>
                <input type="text" id="inp-address1" value="1234 YOUR LOCATION HERE" oninput="updateField('address1', this.value)">
            </div>
            <div class="form-group">
                <label>Address Line 2</label>
                <input type="text" id="inp-address2" value="YOUR RD, YOUR STREET" oninput="updateField('address2', this.value)">
            </div>
            <div class="form-group">
                <label>Postal Code</label>
                <input type="text" id="inp-address3" value="POSTAL 00000" oninput="updateField('address3', this.value)">
            </div>
        </div>

        <button class="btn-save" onclick="saveImage()">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            Save Image
        </button>
    </div>

    <script>
        // Real-time update function
        function updateField(field, value) {
            document.getElementById(`disp-${field}`).textContent = value.toUpperCase();
        }

        // Tab Switching Logic
        let currentTab = 'front';
        function switchTab(tab) {
            currentTab = tab;
            
            // Update Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Update Cards
            document.querySelectorAll('.card-wrapper').forEach(card => card.classList.remove('active'));
            document.getElementById(`card-${tab}`).classList.add('active');

            // Update Inputs
            document.getElementById('inputs-front').style.display = tab === 'front' ? 'block' : 'none';
            document.getElementById('inputs-back').style.display = tab === 'back' ? 'block' : 'none';
        }

        // Handle scaling so the 800x450 card fits perfectly into any mobile screen width
        function scalePreview() {
            const container = document.getElementById('preview-box');
            const targetWidth = container.clientWidth;
            // Native card width is 800px. Scale it down to fit screen width.
            const scale = targetWidth / 800; 
            
            document.querySelectorAll('.card-wrapper').forEach(card => {
                card.style.transform = `scale(${scale})`;
            });
            // Adjust container height to match the scaled down card height
            container.style.height = `${450 * scale}px`;
        }

        window.addEventListener('resize', scalePreview);
        // Initial scale on load
        scalePreview();

        // Save Image functionality utilizing html2canvas
        function saveImage() {
            // Get currently active card
            const activeCard = document.getElementById(`card-${currentTab}`);
            
            // Temporarily remove scaling to capture high-res image
            const currentTransform = activeCard.style.transform;
            activeCard.style.transform = 'scale(1)';

            html2canvas(activeCard, {
                scale: 2, // 2x resolution for better quality
                backgroundColor: "#ffffff",
                useCORS: true
            }).then(canvas => {
                // Restore scale
                activeCard.style.transform = currentTransform;

                // Create download link
                const link = document.createElement('a');
                link.download = `business_card_${currentTab}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                /* NOTE FOR ANDROID WEBVIEW IMPLEMENTATION: 
                   If running inside Kotlin/Android WebView, standard anchor tag downloads 
                   might require you to override `setDownloadListener` in your WebViewClient, 
                   or alternatively inject a JS Interface to pass the Base64 string directly 
                   to your Kotlin environment (e.g., AndroidInterface.saveBase64(canvas.toDataURL())).
                */
            });
        }
    </script>
</body>
</html>
