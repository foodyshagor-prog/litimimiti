<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Business Card Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --accent-blue: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
            --card-width: 350px;
            --card-height: 200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- STICKY TOP PREVIEW SECTION --- */
        .preview-header {
            position: sticky;
            top: 0;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 16px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .card-stage {
            width: var(--card-width);
            height: var(--card-height);
            perspective: 1000px;
        }

        /* --- BUSINESS CARD CUSTOM STYLES (SAME TO SAME EFFECT) --- */
        .business-card {
            width: 100%;
            height: 100%;
            background: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: none;
        }

        .business-card.active {
            display: block;
        }

        /* Front Card Elements */
        .bc-front .dark-diagonal {
            position: absolute;
            right: 0;
            top: 0;
            width: 60%;
            height: 100%;
            background: #111622;
            clip-path: polygon(28% 0, 100% 0, 100% 100%, 0% 100%);
            z-index: 1;
        }

        .bc-front .top-blue-poly {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 55%;
            background: linear-gradient(135deg, #5ea1f4 0%, #2f74e5 100%);
            clip-path: polygon(36% 0, 100% 0, 68% 100%, 0 100%);
            z-index: 2;
        }

        .bc-front .bottom-blue-poly {
            position: absolute;
            left: 20%;
            bottom: 0;
            width: 40%;
            height: 30%;
            background: linear-gradient(135deg, #5ea1f4 0%, #2f74e5 100%);
            clip-path: polygon(25% 0, 100% 0, 75% 100%, 0% 100%);
            z-index: 2;
        }

        .bc-front .right-blue-tip {
            position: absolute;
            right: 0;
            top: 38%;
            width: 3%;
            height: 24%;
            background: linear-gradient(135deg, #5ea1f4 0%, #2f74e5 100%);
            clip-path: polygon(100% 0, 100% 100%, 0 50%);
            z-index: 2;
        }

        .bc-front .qr-wrapper {
            position: absolute;
            left: 92px;
            top: 14px;
            width: 32px;
            height: 32px;
            background: white;
            padding: 2px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bc-front .qr-wrapper svg {
            width: 100%;
            height: 100%;
        }

        /* Front Typography & Layout */
        .bc-front .brand-block {
            position: absolute;
            left: 24px;
            bottom: 24px;
            z-index: 3;
            color: #111622;
        }

        .company-logo-svg {
            width: 26px;
            height: 26px;
            margin-bottom: 4px;
            fill: #2f74e5;
        }

        .bc-front .comp-name {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.5px;
            line-height: 1.2;
            text-transform: uppercase;
        }

        .bc-front .comp-slogan {
            font-size: 7px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .bc-front .profile-block {
            position: absolute;
            right: 24px;
            top: 24px;
            z-index: 3;
            text-align: right;
        }

        .bc-front .user-name {
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .bc-front .user-title {
            color: #8cb6f9;
            font-size: 8px;
            font-weight: 500;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .bc-front .contact-list {
            position: absolute;
            right: 24px;
            bottom: 20px;
            z-index: 3;
            display: flex;
            flex-direction: column;
            gap: 6px;
            align-items: flex-start;
            width: 145px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #d1d5db;
            font-size: 7.5px;
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .contact-item svg {
            width: 10px;
            height: 10px;
            fill: #8cb6f9;
            flex-shrink: 0;
        }

        /* Back Card Elements */
        .bc-back .top-left-blue {
            position: absolute;
            left: 0;
            top: 0;
            width: 40%;
            height: 40%;
            background: linear-gradient(135deg, #5ea1f4 0%, #2f74e5 100%);
            clip-path: polygon(0 0, 100% 0, 42% 100%, 0% 100%);
        }

        .bc-back .top-left-dark {
            position: absolute;
            left: 0;
            top: 0;
            width: 20%;
            height: 45%;
            background: #111622;
            clip-path: polygon(0 0, 100% 0, 0 100%);
        }

        .bc-back .bottom-right-blue {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 40%;
            height: 40%;
            background: linear-gradient(135deg, #5ea1f4 0%, #2f74e5 100%);
            clip-path: polygon(58% 0, 100% 0, 100% 100%, 0% 100%);
        }

        .bc-back .bottom-right-dark {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 25%;
            height: 50%;
            background: #111622;
            clip-path: polygon(100% 0, 100% 100%, 0 100%);
        }

        .bc-back .center-brand {
            position: absolute;
            left: 50%;
            top: 45%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
            color: #111622;
        }

        .bc-back .comp-name {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .bc-back .comp-slogan {
            font-size: 9px;
            font-weight: 600;
            color: #64748b;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .bc-back .web-footer {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: #475569;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* --- CONTROLS BAR (TOGGLE & SAVE) --- */
        .control-bar {
            display: flex;
            width: var(--card-width);
            justify-content: space-between;
            align-items: center;
        }

        .side-switch {
            background: var(--input-bg);
            padding: 4px;
            border-radius: 30px;
            display: flex;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .switch-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .switch-btn.active {
            background: var(--accent-gradient);
            color: var(--text-main);
            box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
        }

        .btn-save {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 8px 18px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        /* --- EDITOR CONTAINER (BOTTOM) --- */
        .editor-container {
            flex-grow: 1;
            background: var(--panel-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-group label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .input-group input {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            border-color: var(--accent-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }
    </style>
</head>
<body>

    <div class="preview-header">
        <div class="card-stage">
            <div id="card-front" class="business-card bc-front active">
                <div class="top-blue-poly"></div>
                <div class="bottom-blue-poly"></div>
                <div class="right-blue-tip"></div>
                <div class="dark-diagonal"></div>
                
                <div class="qr-wrapper">
                    <svg viewBox="0 0 29 29">
                        <path d="M0 0h9v9H0zm1 1v7h7V1zm2 2h3v3H3zM15 0h9v9h-9zm1 1v7h7V1zm2 2h3v3h-3zM0 15h9v9H0zm1 1v7h7v-7zm2 2h3v3H3zM22 12h2v3h-2zm-3 3h3v2h-3zm-4 1h2v3h-2zm4 4h3v2h-3zm-4-2h2v2h-2zm8-2h3v2h-3zm-4-4h2v2h-2zm6-2h3v2h-3zm-6 9h2v2h-2zm2 2h2v2h-2zm3-7h2v2h-2zm1 4h2v3h-2zm-6 4h2v2h-2z" fill="#2f74e5"/>
                    </svg>
                </div>

                <div class="brand-block">
                    <svg class="company-logo-svg" viewBox="0 0 24 24">
                        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2zm0 2.31L5.33 8.16v7.68L12 19.69l6.67-3.85V8.16L12 4.31z"/>
                    </svg>
                    <div class="comp-name" id="lbl-comp-name">Company Name</div>
                    <div class="comp-slogan" id="lbl-comp-slogan">Slogan Here</div>
                </div>

                <div class="profile-block">
                    <div class="user-name" id="lbl-user-name">Jhon Charlos</div>
                    <div class="user-title" id="lbl-user-title">Graphic Designer</div>
                </div>

                <div class="contact-list">
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        <span id="lbl-address">Los Angles, Str Center 123/B</span>
                    </div>
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                        <span id="lbl-phone">001 234 567 910</span>
                    </div>
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                        <span id="lbl-email">yourcompany@gmail.com</span>
                    </div>
                    <div class="contact-item">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95c-.32-1.25-.78-2.45-1.38-3.56 1.84.42 3.43 1.4 4.33 3.56zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.34-.14 2 0 .66.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56-1.84-.42-3.43-1.4-4.33-3.56zm2.95-8H5.08c.91-2.16 2.5-3.14 4.33-3.56-.6 1.11-1.06 2.31-1.38 3.56zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.34-.16-2 0-.66.07-1.34.16-2h4.68c.09.66.16 1.34.16 2 0 .66-.07 1.34-.16 2zm.24 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95c-.9 2.16-2.5 3.14-4.33 3.56zm1.64-5.56c.08-.66.14-1.34.14-2 0-.66-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
                        <span id="lbl-web">www.yourcompany.com</span>
                    </div>
                </div>
            </div>

            <div id="card-back" class="business-card bc-back">
                <div class="top-left-blue"></div>
                <div class="top-left-dark"></div>
                <div class="bottom-right-blue"></div>
                <div class="bottom-right-dark"></div>
                
                <div class="center-brand">
                    <svg class="company-logo-svg" style="width: 36px; height:36px; margin-bottom: 6px;" viewBox="0 0 24 24">
                        <path d="M12 2l8.66 5v10L12 22l-8.66-5V7L12 2zm0 2.31L5.33 8.16v7.68L12 19.69l6.67-3.85V8.16L12 4.31z"/>
                    </svg>
                    <div class="comp-name" id="lbl-back-comp-name">Company Name</div>
                    <div class="comp-slogan" id="lbl-back-comp-slogan">Slogan Here</div>
                </div>

                <div class="web-footer" id="lbl-back-web">www.yourcompany.com</div>
            </div>
        </div>

        <div class="control-bar">
            <div class="side-switch">
                <button class="switch-btn active" onclick="switchSide('front')">Front</button>
                <button class="switch-btn" onclick="switchSide('back')">Back</button>
            </div>
            <button class="btn-save" onclick="saveCardImage()">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4M7 10l5 5 5-5M12 15V3"/></svg>
                Save Card
            </button>
        </div>
    </div>

    <div class="editor-container">
        <div class="section-title">Company Info</div>
        <div class="input-group">
            <label>Company Name</label>
            <input type="text" id="input-comp-name" value="Company Name" placeholder="e.g., NEXUS DESIGN">
        </div>
        <div class="input-group">
            <label>Slogan / Tagline</label>
            <input type="text" id="input-comp-slogan" value="Slogan Here" placeholder="e.g., INNOVATING CREATIVITY">
        </div>

        <div class="section-title" style="margin-top: 10px;">Personal Info</div>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="input-user-name" value="Jhon Charlos" placeholder="e.g., John Doe">
        </div>
        <div class="input-group">
            <label>Job Title</label>
            <input type="text" id="input-user-title" value="Graphic Designer" placeholder="e.g., Android Developer">
        </div>

        <div class="section-title" style="margin-top: 10px;">Contact Details</div>
        <div class="input-group">
            <label>Location Address</label>
            <input type="text" id="input-address" value="Los Angles, Str Center 123/B" placeholder="City, Country">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="input-phone" value="001 234 567 910" placeholder="+00 000 000 000">
        </div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="text" id="input-email" value="yourcompany@gmail.com" placeholder="name@domain.com">
        </div>
        <div class="input-group">
            <label>Website URL</label>
            <input type="text" id="input-web" value="www.yourcompany.com" placeholder="www.domain.com">
        </div>
    </div>

    <script>
        // Toggle Active Card Side Display Layout
        function switchSide(side) {
            document.querySelectorAll('.business-card').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('.switch-btn').forEach(btn => btn.classList.remove('active'));
            
            if(side === 'front') {
                document.getElementById('card-front').classList.add('active');
                event.target.classList.add('active');
            } else {
                document.getElementById('card-back').classList.add('active');
                event.target.classList.add('active');
            }
        }

        // Real-time Text Component Sync Logic
        const bindings = [
            { input: 'input-comp-name', targets: ['lbl-comp-name', 'lbl-back-comp-name'] },
            { input: 'input-comp-slogan', targets: ['lbl-comp-slogan', 'lbl-back-comp-slogan'] },
            { input: 'input-user-name', targets: ['lbl-user-name'] },
            { input: 'input-user-title', targets: ['lbl-user-title'] },
            { input: 'input-address', targets: ['lbl-address'] },
            { input: 'input-phone', targets: ['lbl-phone'] },
            { input: 'input-email', targets: ['lbl-email'] },
            { input: 'input-web', targets: ['lbl-web', 'lbl-back-web'] }
        ];

        bindings.forEach(binding => {
            const inputEl = document.getElementById(binding.input);
            inputEl.addEventListener('input', (e) => {
                binding.targets.forEach(targetId => {
                    document.getElementById(targetId).innerText = e.target.value;
                });
            });
        });

        // High-Quality Asset Capture & Export Setup
        function saveCardImage() {
            const frontCard = document.getElementById('card-front');
            const backCard = document.getElementById('card-back');
            
            const baseOptions = {
                scale: 3, // Multiplies canvas definition scale for sharp high-res export
                useCORS: true,
                backgroundColor: null,
                logging: false,
                width: 350,
                height: 200
            };

            // Inject layout style changes safely inside the cloned sandbox document window 
            // to capture hidden sides correctly without jarring layout shifts on screen
            const frontOptions = {
                ...baseOptions,
                onclone: (clonedDoc) => {
                    clonedDoc.getElementById('card-front').style.display = 'block';
                }
            };

            const backOptions = {
                ...baseOptions,
                onclone: (clonedDoc) => {
                    clonedDoc.getElementById('card-back').style.display = 'block';
                }
            };

            // Concurrently capture clean graphic assets for both sides
            Promise.all([
                html2canvas(frontCard, frontOptions),
                html2canvas(backCard, backOptions)
            ]).then(([canvasFront, canvasBack]) => {
                const scale = baseOptions.scale;
                
                // Outer framing metrics scaled symmetrically
                const padding = 40 * scale; 
                const gap = 30 * scale;     

                // Build a unified structural canvas container layout block
                const finalCanvas = document.createElement('canvas');
                finalCanvas.width = canvasFront.width + (padding * 2);
                finalCanvas.height = canvasFront.height + canvasBack.height + gap + (padding * 2);

                const ctx = finalCanvas.getContext('2d');

                // Render clean application presentation layer background accent
                ctx.fillStyle = '#f0f2f5';
                ctx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);

                // Draw front side centered graphic layout assets
                ctx.drawImage(canvasFront, padding, padding);

                // Draw back side centered graphic layout assets shifted down past vertical gap separation
                ctx.drawImage(canvasBack, padding, padding + canvasFront.height + gap);

                const base64Image = finalCanvas.toDataURL('image/png');
                
                // Native Bridge Trigger for Android Kotlin/Java WebViews
                if (window.Android && window.Android.saveImage) {
                    window.Android.saveImage(base64Image);
                } else {
                    // Standard Web Browser Fallback Method
                    const downloadLink = document.createElement('a');
                    downloadLink.href = base64Image;
                    downloadLink.download = `BusinessCard_Combined_${Date.now()}.png`;
                    document.body.appendChild(downloadLink);
                    downloadLink.click();
                    document.body.removeChild(downloadLink);
                }
            }).catch(err => {
                console.error("Error capturing card asset output layout: ", err);
            });
        }
    </script>
</body>
</html>
