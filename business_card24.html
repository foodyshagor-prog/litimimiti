<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a, #1e1e2f);
            --panel-bg: #1e293b;
            --accent: #F5A623;
            --text-light: #f8fafc;
            --input-bg: #0f172a;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-light);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header & Toolbar --- */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            z-index: 10;
        }

        .toggle-group {
            display: flex;
            background: var(--input-bg);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .toggle-btn {
            background: transparent;
            color: #94a3b8;
            border: none;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.2s;
        }

        .toggle-btn.active {
            background: var(--accent);
            color: #fff;
        }

        .save-btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .save-btn:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        /* --- Preview Area --- */
        .preview-container {
            width: 100%;
            height: 250px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.2);
            overflow: hidden;
        }

        /* The scaling wrapper makes the 800x450 card fit on mobile screens */
        .scale-wrapper {
            transform-origin: center center;
            transition: transform 0.3s ease;
        }

        /* --- High-Res Business Card Styles (800x450) --- */
        .card {
            width: 800px;
            height: 450px;
            position: relative;
            background: #222;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
        }

        .card-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
        }

        /* Logo Component */
        .logo-box {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #111;
        }
        .logo-icon { width: 48px; height: 48px; margin-bottom: 8px; }
        .logo-text { font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: 1px; }
        .logo-sub { font-size: 16px; font-weight: 600; letter-spacing: 3px; }

        /* Front Card Specifics */
        #card-front .logo-box {
            top: 240px;
            left: 100px;
        }
        
        .person-info {
            position: absolute;
            top: 70px;
            right: 50px;
            text-align: right;
            color: #fff;
        }
        .person-name { font-size: 38px; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; }
        .person-title { font-size: 16px; font-weight: 600; letter-spacing: 4px; margin-bottom: 50px; color: #ddd; }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: flex-end;
        }
        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .contact-text { font-size: 14px; font-weight: 600; letter-spacing: 1px; }
        .contact-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #111;
        }
        .contact-icon svg { width: 16px; height: 16px; }

        /* Back Card Specifics */
        #card-back .logo-box {
            top: 180px;
            left: 140px;
        }

        /* --- Editor Area (Bottom Scrollable) --- */
        .editor-container {
            flex: 1;
            background: var(--panel-bg);
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.3);
        }

        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: white;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(245, 166, 35, 0.2);
        }

        /* Section Title in Editor */
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin: 25px 0 15px 0;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 8px;
        }
        .section-title:first-child { margin-top: 0; }
    </style>
</head>
<body>

    <div class="toolbar">
        <div class="toggle-group">
            <button class="toggle-btn active" id="btn-front" onclick="switchSide('front')">Front</button>
            <button class="toggle-btn" id="btn-back" onclick="switchSide('back')">Back</button>
        </div>
        <button class="save-btn" onclick="saveCard()">
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path><path d="M17 21v-8H7v8"></path><path d="M7 3v5h8V3"></path></svg>
            Save Presentation Image
        </button>
    </div>

    <div class="preview-container" id="preview-box">
        <div class="scale-wrapper" id="scale-wrapper">
            
            <div id="card-front" class="card">
                <svg class="card-bg" viewBox="0 0 800 450" preserveAspectRatio="none">
                    <rect width="800" height="450" fill="#202020" />
                    <polygon points="0,0 300,0 0,300" fill="#ffffff" />
                    <polygon points="0,150 350,0 520,450 0,450" fill="#F5A623" />
                </svg>

                <div class="card-content">
                    <div class="logo-box">
                        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M24 2 L34 12 L24 22 L14 12 Z" />
                            <path d="M24 26 L34 36 L24 46 L14 36 Z" />
                            <path d="M10 14 L20 24 L10 34 L0 24 Z" />
                            <path d="M38 14 L48 24 L38 34 L28 24 Z" />
                        </svg>
                        <div class="logo-text out-company1">CREATIVE</div>
                        <div class="logo-sub out-company2">COMPANY</div>
                    </div>

                    <div class="person-info">
                        <div class="person-name" id="out-name">SHAGOR</div>
                        <div class="person-title" id="out-title">AI DEVELOPER & PHOTO EDITOR</div>
                        
                        <div class="contact-list">
                            <div class="contact-item">
                                <span class="contact-text" id="out-email">HELLO@SHAGORPHOTOEDITOR.COM</span>
                                <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg></div>
                            </div>
                            <div class="contact-item">
                                <span class="contact-text" id="out-phone">123-456-7890</span>
                                <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></div>
                            </div>
                            <div class="contact-item">
                                <span class="contact-text" id="out-address">SAVAR, DHAKA DIVISION</span>
                                <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></div>
                            </div>
                            <div class="contact-item">
                                <span class="contact-text" id="out-website">WWW.SHAGORPHOTOEDITOR.COM</span>
                                <div class="contact-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="card-back" class="card" style="display: none;">
                <svg class="card-bg" viewBox="0 0 800 450" preserveAspectRatio="none">
                    <rect width="800" height="450" fill="#F5A623" />
                    <polygon points="350,0 800,0 800,450 200,450" fill="#E09612" />
                    <polygon points="480,450 800,130 800,450" fill="#ffffff" />
                    <polygon points="530,450 800,180 800,450" fill="#202020" />
                </svg>

                <div class="card-content">
                    <div class="logo-box">
                        <svg class="logo-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M24 2 L34 12 L24 22 L14 12 Z" />
                            <path d="M24 26 L34 36 L24 46 L14 36 Z" />
                            <path d="M10 14 L20 24 L10 34 L0 24 Z" />
                            <path d="M38 14 L48 24 L38 34 L28 24 Z" />
                        </svg>
                        <div class="logo-text out-company1">CREATIVE</div>
                        <div class="logo-sub out-company2">COMPANY</div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <div class="editor-container">
        
        <div class="section-title">Brand Identity</div>
        <div class="input-group">
            <label>Company Name</label>
            <input type="text" id="in-comp1" value="CREATIVE" oninput="updateText('.out-company1', this.value)">
        </div>
        <div class="input-group">
            <label>Company Subtitle</label>
            <input type="text" id="in-comp2" value="COMPANY" oninput="updateText('.out-company2', this.value)">
        </div>

        <div class="section-title">Personal Details</div>
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="in-name" value="Shagor" oninput="updateText('#out-name', this.value)">
        </div>
        <div class="input-group">
            <label>Job Title</label>
            <input type="text" id="in-title" value="AI Developer & Photo Editor" oninput="updateText('#out-title', this.value)">
        </div>

        <div class="section-title">Contact Information</div>
        <div class="input-group">
            <label>Email Address</label>
            <input type="text" id="in-email" value="hello@shagorphotoeditor.com" oninput="updateText('#out-email', this.value)">
        </div>
        <div class="input-group">
            <label>Phone Number</label>
            <input type="tel" id="in-phone" value="123-456-7890" oninput="updateText('#in-phone', this.value)">
        </div>
        <div class="input-group">
            <label>Location</label>
            <input type="text" id="in-address" value="Savar, Dhaka Division" oninput="updateText('#out-address', this.value)">
        </div>
        <div class="input-group">
            <label>Website / Social</label>
            <input type="text" id="in-website" value="www.shagorphotoeditor.com" oninput="updateText('#out-website', this.value)">
        </div>
    </div>

    <script>
        let currentSide = 'front';

        // Update Card Text Data
        function updateText(selector, value) {
            const elements = document.querySelectorAll(selector);
            elements.forEach(el => {
                el.innerText = value.toUpperCase();
            });
        }

        // Switch between Front and Back preview
        function switchSide(side) {
            currentSide = side;
            
            // Update buttons
            document.getElementById('btn-front').classList.toggle('active', side === 'front');
            document.getElementById('btn-back').classList.toggle('active', side === 'back');
            
            // Update cards
            document.getElementById('card-front').style.display = side === 'front' ? 'block' : 'none';
            document.getElementById('card-back').style.display = side === 'back' ? 'block' : 'none';
        }

        // Dynamically scale the 800x450 card to fit any mobile screen gracefully
        function resizePreview() {
            const previewBox = document.getElementById('preview-box');
            const wrapper = document.getElementById('scale-wrapper');
            const targetWidth = previewBox.clientWidth * 0.95;
            const scale = targetWidth / 800;
            
            wrapper.style.transform = `scale(${Math.min(scale, 1)})`;
        }

        // Modernized Save Functionality combining Front and Back into a structured presentation graphic
        function saveCard() {
            const btn = document.querySelector('.save-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = "Saving...";
            
            // 1. Create a pristine presentation wrapper off-screen
            const presentationContainer = document.createElement('div');
            presentationContainer.style.position = 'absolute';
            presentationContainer.style.top = '-9999px';
            presentationContainer.style.left = '-9999px';
            presentationContainer.style.background = '#f0f2f5'; // Light gray layout presentation bg
            presentationContainer.style.display = 'flex';
            presentationContainer.style.flexDirection = 'column'; // Vertical stack alignment
            presentationContainer.style.alignItems = 'center';
            presentationContainer.style.padding = '60px'; // Outer display margins
            presentationContainer.style.gap = '40px';      // Balanced structural gap between cards
            presentationContainer.style.width = 'max-content';

            // 2. Deep clone layout targets directly to avoid runtime CSS transform corruption
            const frontCardOriginal = document.getElementById('card-front');
            const backCardOriginal = document.getElementById('card-back');
            
            const frontClone = frontCardOriginal.cloneNode(true);
            const backClone = backCardOriginal.cloneNode(true);

            // 3. Reset internal view properties to force 1:1 scale ratios natively
            frontClone.style.display = 'block';
            frontClone.style.transform = 'none';
            frontClone.style.position = 'relative';
            frontClone.style.top = '0';
            frontClone.style.left = '0';

            backClone.style.display = 'block';
            backClone.style.transform = 'none';
            backClone.style.position = 'relative';
            backClone.style.top = '0';
            backClone.style.left = '0';

            // Append structured nodes to container
            presentationContainer.appendChild(frontClone);
            presentationContainer.appendChild(backClone);
            document.body.appendChild(presentationContainer);

            // 4. Capture complete unscaled layout structure smoothly
            html2canvas(presentationContainer, {
                scale: 2, // 2x Multiplier ensures crisp, readable small type configurations
                backgroundColor: '#f0f2f5',
                useCORS: true,
                logging: false
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `business_card_presentation.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                // Tear down temporary DOM node trees
                document.body.removeChild(presentationContainer);
                btn.innerHTML = originalText;
            }).catch(err => {
                console.error("Error saving image presentation: ", err);
                alert("Could not process your composite presentation image.");
                if (document.body.contains(presentationContainer)) {
                    document.body.removeChild(presentationContainer);
                }
                btn.innerHTML = originalText;
            });
        }

        // Listen for screen size changes
        window.addEventListener('resize', resizePreview);
        
        // Initial setup
        window.onload = () => {
            resizePreview();
            updateText('#out-name', document.getElementById('in-name').value);
            updateText('#out-title', document.getElementById('in-title').value);
        };
    </script>
</body>
</html>
