<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Tool</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --primary-orange: #f38e21;
            --dark-shape: #1a1a1a;
            --bg-gradient: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            --input-bg: #334155;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background: var(--bg-gradient); 
            color: white; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PREVIEW SECTION (TOP) --- */
        .preview-area {
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .switch-container {
            display: flex;
            background: var(--input-bg);
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 20px;
            width: 220px;
        }

        .switch-btn {
            flex: 1;
            border: none;
            background: none;
            color: #94a3b8;
            padding: 8px;
            border-radius: 21px;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .switch-btn.active {
            background: var(--primary-orange);
            color: white;
        }

        /* --- CARD DESIGN (EXACT MATCH) --- */
        #capture-target {
            background: transparent;
            padding: 10px;
        }

        .card {
            width: 350px;
            height: 200px;
            background: white;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            color: #333;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            display: none;
        }

        .card.active { display: block; }

        /* Front Page Elements */
        .leaf-top {
            position: absolute;
            top: 15px; left: -10px;
            width: 50px; height: 40px;
            background: var(--primary-orange);
            border-radius: 0 50% 0 50%;
            transform: rotate(15deg);
        }

        .black-shape-left {
            position: absolute;
            bottom: 10px; left: 0;
            width: 45px; height: 110px;
            background: var(--dark-shape);
            border-radius: 0 30px 30px 0;
        }

        .front-content {
            display: flex;
            height: 100%;
            padding-left: 50px;
            align-items: center;
        }

        .logo-section {
            width: 100px;
            text-align: center;
        }

        .logo-circle {
            width: 45px; height: 45px;
            border: 4px solid var(--primary-orange);
            border-radius: 50%;
            margin: 0 auto;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-circle::after {
            content: "W"; /* Placeholder for the glyph in image */
            color: var(--primary-orange);
            font-weight: 900;
            font-size: 22px;
        }

        .logo-text {
            font-weight: 800;
            font-size: 18px;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        .vertical-divider {
            width: 3px;
            height: 120px;
            background: var(--primary-orange);
            margin: 0 20px;
            border-radius: 50% / 10%; /* Creates the tapered look */
        }

        .info-section {
            flex: 1;
        }

        .user-name { font-size: 18px; font-weight: 800; margin: 0; }
        .user-name span { font-weight: 400; }
        .user-title { 
            font-size: 9px; 
            text-transform: uppercase; 
            font-weight: 700; 
            letter-spacing: 1px;
            border-bottom: 1px solid #333;
            display: inline-block;
            padding-bottom: 2px;
            margin-bottom: 10px;
        }

        .contact-row {
            display: flex;
            align-items: center;
            font-size: 8px;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .contact-row svg { width: 10px; height: 10px; margin-right: 8px; fill: var(--dark-shape); }

        /* Back Page Elements */
        .back-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .black-bar-bottom {
            position: absolute;
            bottom: 15px; left: 0;
            width: 70%; height: 25px;
            background: var(--dark-shape);
            border-radius: 0 15px 0 0;
        }

        .leaf-bottom {
            position: absolute;
            bottom: 15px; right: 45px;
            width: 50px; height: 22px;
            background: var(--primary-orange);
            border-radius: 20px 0 20px 0;
        }

        .back-web {
            position: absolute;
            bottom: 5px;
            width: 100%;
            font-size: 8px;
            font-weight: 700;
        }

        /* --- EDITOR SECTION (BOTTOM) --- */
        .editor-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 30px 30px 0 0;
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .input-group input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            border-radius: 10px;
            color: white;
            outline: none;
        }

        .save-btn {
            background: var(--primary-orange);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(243, 142, 33, 0.3);
        }
    </style>
</head>
<body>

    <div class="preview-area">
        <div class="switch-container">
            <button class="switch-btn active" onclick="togglePage('front', this)">Front Page</button>
            <button class="switch-btn" onclick="togglePage('back', this)">Back Page</button>
        </div>

        <div id="capture-target">
            <!-- Front Card -->
            <div id="card-front" class="card active">
                <div class="leaf-top"></div>
                <div class="black-shape-left"></div>
                <div class="front-content">
                    <div class="logo-section">
                        <div class="logo-circle"></div>
                        <div class="logo-text edit-logo">LOGO</div>
                    </div>
                    <div class="vertical-divider"></div>
                    <div class="info-section">
                        <h2 class="user-name"><span id="txt-first">Eddie</span> <span id="txt-last" style="font-weight: 800;">Jones</span></h2>
                        <div class="user-title edit-title">Graphic Designer</div>
                        <div class="contact-row">
                            <svg viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 006.59 6.59l2.2-2.2a1 1 0 011.11-.27 11.72 11.72 0 003.7.59 1 1 0 011 1V20a1 1 0 01-1 1A15 15 0 013 6a1 1 0 011-1h3.5a1 1 0 011 1 11.72 11.72 0 00.59 3.7 1 1 0 01-.27 1.11l-2.2 2.2z"/></svg>
                            <span class="edit-phone">+000 123 456 - 789</span>
                        </div>
                        <div class="contact-row">
                            <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <span class="edit-email">loremipsum@ipsum.com</span>
                        </div>
                        <div class="contact-row">
                            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
                            <span class="edit-address">Lorem ipsum street</span>
                        </div>
                        <div class="contact-row">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            <span class="edit-web">www.loremipsum.com</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Back Card -->
            <div id="card-back" class="card">
                <div class="back-card" style="height: 100%;">
                    <div class="logo-circle"></div>
                    <div class="logo-text edit-logo" style="font-size: 14px;">COMPANY LOGO</div>
                    <div class="edit-tagline" style="font-size: 8px; letter-spacing: 2px; color: #666;">TAGLINE HERE</div>
                    <div class="black-bar-bottom"></div>
                    <div class="leaf-bottom"></div>
                    <div class="back-web edit-web">www.loremipsum.com</div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-area">
        <div class="input-group">
            <label>Full Name</label>
            <div style="display:flex; gap:10px;">
                <input type="text" id="in-first" value="Eddie" oninput="sync('txt-first', this.value)">
                <input type="text" id="in-last" value="Jones" oninput="sync('txt-last', this.value)">
            </div>
        </div>
        <div class="input-group">
            <label>Job Title</label>
            <input type="text" value="Graphic Designer" oninput="syncClass('edit-title', this.value)">
        </div>
        <div class="input-group">
            <label>Company / Logo Text</label>
            <input type="text" value="LOGO" oninput="syncClass('edit-logo', this.value)">
        </div>
        <div class="input-group">
            <label>Tagline (Back Page)</label>
            <input type="text" value="TAGLINE HERE" oninput="syncClass('edit-tagline', this.value)">
        </div>
        <div class="input-group">
            <label>Phone</label>
            <input type="text" value="+000 123 456 - 789" oninput="syncClass('edit-phone', this.value)">
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="text" value="loremipsum@ipsum.com" oninput="syncClass('edit-email', this.value)">
        </div>
        <div class="input-group">
            <label>Website</label>
            <input type="text" value="www.loremipsum.com" oninput="syncClass('edit-web', this.value)">
        </div>
        <div class="input-group">
            <label>Address</label>
            <input type="text" value="Lorem ipsum street" oninput="syncClass('edit-address', this.value)">
        </div>
        
        <button class="save-btn" onclick="saveCard()">SAVE AS IMAGE</button>
        <div style="height: 40px;"></div>
    </div>

    <script>
        function togglePage(side, btn) {
            document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.switch-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('card-' + side).classList.add('active');
            btn.classList.add('active');
        }

        function sync(id, val) {
            document.getElementById(id).innerText = val;
        }

        function syncClass(cls, val) {
            document.querySelectorAll('.' + cls).forEach(el => el.innerText = val);
        }

        function saveCard() {
            const activeCard = document.querySelector('.card.active');
            html2canvas(activeCard, {
                scale: 3, // Higher resolution
                useCORS: true,
                backgroundColor: null
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'business-card.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }
    </script>
</body>
</html>
