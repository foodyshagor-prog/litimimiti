<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-top: #2c2c38;
            --bg-bottom: #0f0f13;
            --accent: #b873ff;
            --input-bg: #1e1e24;
            --text-light: #e0e0e0;
            --panel-bg: #16161c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Lock screen layout strictly for mobile dimensions */
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            overflow: hidden;
        }

        /* Primary Mobile App Container Shell */
        .app-shell {
            width: 100%;
            max-width: 480px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: rgba(15, 15, 19, 0.95);
            position: relative;
        }

        /* --- FIXED TOP PREVIEW SECTION --- */
        .preview-sticky-panel {
            flex-shrink: 0;
            background: var(--panel-bg);
            padding: 15px 20px 20px 20px;
            border-bottom: 1px solid #2a2a35;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        h1.app-title {
            text-align: center;
            font-size: 18px;
            margin-bottom: 12px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Switch Mode Segmented Control */
        .mode-switch-container {
            display: flex;
            background: #252530;
            border-radius: 25px;
            padding: 4px;
            margin-bottom: 15px;
        }

        .switch-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #a0a0b0;
            padding: 8px 0;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .switch-btn.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 8px rgba(184, 115, 255, 0.4);
        }

        /* Display deck viewport */
        .card-viewport {
            position: relative;
            width: 100%;
            aspect-ratio: 1.75 / 1;
        }

        .card-wrapper {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            opacity: 0;
            visibility: hidden;
            transform: scale(0.96);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s;
        }

        .card-wrapper.active {
            opacity: 1;
            visibility: visible;
            transform: scale(1);
        }

        /* Improved rule to ensure hidden element capture by html2canvas */
        .card-wrapper.force-capture {
            opacity: 1 !important;
            visibility: visible !important;
            position: absolute !important;
            z-index: -9999 !important;
            transform: scale(1) !important;
            pointer-events: none !important;
        }

        .business-card {
            width: 100%;
            height: 100%;
            background: #111111;
            position: relative;
            overflow: hidden;
        }

        .flower-img {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .front-card .flower-img {
            top: -45%;
            left: 15%;
            width: 70%;
        }

        .back-card .flower-img {
            top: -15%;
            left: -35%;
            height: 130%;
            width: auto;
        }

        .front-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12%;
        }

        .name-text {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 4.5vw, 22px);
            font-weight: 400;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0;
            text-align: center;
        }

        .role-text {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(14px, 4.5vw, 20px);
            color: #d8d8d8;
            margin: 4px 0 0 0;
            font-weight: normal;
            text-align: center;
        }

        .back-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-left: 35%;
            width: 60%;
        }

        .book-now {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(20px, 7vw, 32px);
            color: #ffffff;
            margin: 0 0 12px 0;
            font-weight: normal;
        }

        .details-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .details-text div {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(8px, 2.5vw, 12px);
            font-weight: 300;
            color: #ffffff;
            text-align: center;
        }

        /* --- SMOOTH SCROLLABLE EDITOR SECTION --- */
        .editor-scroll-panel {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            padding: 20px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            margin-bottom: 6px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #3a3a45;
            background: var(--input-bg);
            color: white;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        input[type="file"] {
            padding: 11px 14px;
            background: #23232b;
        }

        /* --- BUTTONS --- */
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            margin-bottom: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #9b51e0, #6bb5ff);
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(155, 81, 224, 0.25);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="app-shell">
        
        <div class="preview-sticky-panel">
            <h1 class="app-title">Card Creator</h1>
            
            <div class="mode-switch-container">
                <button id="tab-front" class="switch-btn active" onclick="switchView('front')">Front Side</button>
                <button id="tab-back" class="switch-btn" onclick="switchView('back')">Back Side</button>
            </div>

            <div class="card-viewport">
                
                <div id="wrapper-front" class="card-wrapper active">
                    <div id="card-front" class="business-card front-card">
                        <img id="img-front" class="flower-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b873ff' opacity='0.5'/><text x='50' y='55' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>Upload Flower</text></svg>" alt="Flower">
                        <div class="front-content">
                            <h1 id="out-name" class="name-text">ELIZABETH MONROE</h1>
                            <h2 id="out-role" class="role-text">Hair Stylist & Makeup Artist</h2>
                        </div>
                    </div>
                </div>

                <div id="wrapper-back" class="card-wrapper">
                    <div id="card-back" class="business-card back-card">
                        <img id="img-back" class="flower-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b873ff' opacity='0.5'/><text x='50' y='55' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>Upload Flower</text></svg>" alt="Flower">
                        <div class="back-content">
                            <h2 class="book-now">Book Now</h2>
                            <div class="details-text">
                                <div id="out-email">ElizabethMonroe@email.com</div>
                                <div id="out-website">ElizabethMonroe.com</div>
                                <div id="out-phone">312-555-5213</div>
                                <div id="out-address">927 Broadway, Aurora</div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>

        <div class="editor-scroll-panel">
            
            <div class="input-group">
                <label>Upload Transparent Flower (PNG)</label>
                <input type="file" id="flower-upload" accept="image/png">
            </div>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="in-name" value="ELIZABETH MONROE">
            </div>

            <div class="input-group">
                <label>Role / Subtitle</label>
                <input type="text" id="in-role" value="Hair Stylist & Makeup Artist">
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="text" id="in-email" value="ElizabethMonroe@email.com">
            </div>

            <div class="input-group">
                <label>Website</label>
                <input type="text" id="in-website" value="ElizabethMonroe.com">
            </div>

            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="in-phone" value="312-555-5213">
            </div>

            <div class="input-group">
                <label>Address</label>
                <input type="text" id="in-address" value="927 Broadway, Aurora">
            </div>

            <div class="btn-row">
                <button class="btn" onclick="saveCombinedImage()">Save Combined Image</button>
            </div>
            
        </div>

    </div>

    <script {timestamp="2026-06-08"}>
        // Real-time View Swapping Controller
        function switchView(side) {
            const frontWrapper = document.getElementById('wrapper-front');
            const backWrapper = document.getElementById('wrapper-back');
            const tabFront = document.getElementById('tab-front');
            const tabBack = document.getElementById('tab-back');

            if (side === 'front') {
                frontWrapper.classList.add('active');
                backWrapper.classList.remove('active');
                tabFront.classList.add('active');
                tabBack.classList.remove('active');
            } else {
                backWrapper.classList.add('active');
                frontWrapper.classList.remove('active');
                tabBack.classList.add('active');
                tabFront.classList.remove('active');
            }
        }

        // Real-time Dynamic Text Binding Loop
        const fields = ['name', 'role', 'email', 'website', 'phone', 'address'];
        
        fields.forEach(field => {
            const input = document.getElementById(`in-${field}`);
            const output = document.getElementById(`out-${field}`);
            
            input.addEventListener('input', (e) => {
                output.textContent = e.target.value;
            });
        });

        // Safe Image Base64 Rendering Stream
        document.getElementById('flower-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgDataUrl = event.target.result;
                    document.getElementById('img-front').src = imgDataUrl;
                    document.getElementById('img-back').src = imgDataUrl;
                }
                reader.readAsDataURL(file);
            }
        });

        // Combined Document Render Export Logic (Vertical Layout)
        function saveCombinedImage() {
            const cardFront = document.getElementById('card-front');
            const wrapperFront = cardFront.parentElement;
            const cardBack = document.getElementById('card-back');
            const wrapperBack = cardBack.parentElement;
            
            const captureOptions = {
                scale: 3, 
                backgroundColor: "#111111", 
                useCORS: true,
                logging: false
            };

            // Step 1: Manage temporary visibility of hidden element for capture framework
            const isFrontActive = wrapperFront.classList.contains('active');
            if (isFrontActive) {
                wrapperBack.classList.add('force-capture');
            } else {
                wrapperFront.classList.add('force-capture');
            }

            const originalRadiusFront = wrapperFront.style.borderRadius;
            const originalRadiusBack = wrapperBack.style.borderRadius;
            wrapperFront.style.borderRadius = "0";
            wrapperBack.style.borderRadius = "0";

            // Step 2: Extract separate captures via async engine execution
            Promise.all([
                html2canvas(cardFront, captureOptions),
                html2canvas(cardBack, captureOptions)
            ]).then(([canvasFront, canvasBack]) => {
                // Step 3: Restore visibility states cleanly
                wrapperFront.style.borderRadius = originalRadiusFront;
                wrapperBack.style.borderRadius = originalRadiusBack;
                if (isFrontActive) {
                    wrapperBack.classList.remove('force-capture');
                } else {
                    wrapperFront.classList.remove('force-capture');
                }

                // Step 4: Calculate dimensions for VERTICAL alignment
                const scaleFactor = captureOptions.scale;
                const gapPx = 50 * scaleFactor; // Proportionate gap between stacked card faces

                const combinedWidth = Math.max(canvasFront.width, canvasBack.width);
                const combinedHeight = canvasFront.height + canvasBack.height + gapPx;

                // Step 5: Construct the combined workspace canvas
                const combinedCanvas = document.createElement('canvas');
                combinedCanvas.width = combinedWidth;
                combinedCanvas.height = combinedHeight;
                const combinedCtx = combinedCanvas.getContext('2d');

                // Clear background for modern high-res alpha transparent PNG channel output
                combinedCtx.clearRect(0, 0, combinedWidth, combinedHeight);

                // Step 6: Draw layout components vertically stacked
                // Draw Front on top
                combinedCtx.drawImage(canvasFront, 0, 0);
                // Draw Back underneath Front with calculated gap spacing
                combinedCtx.drawImage(canvasBack, 0, canvasFront.height + gapPx);

                // Step 7: Stream image directly into immediate document link downpour pipeline
                const imageURI = combinedCanvas.toDataURL("image/png");
                const link = document.createElement('a');
                link.download = 'Combined-Business-Card.png';
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
</html>
