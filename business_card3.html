<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-top: #2c2c38;
            --bg-bottom: #0f0f13;
            --accent: #b873ff;
            --input-bg: #1e1e24;
            --text-light: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--bg-top), var(--bg-bottom));
            color: white;
            min-height: 100vh;
            padding: 20px 15px;
        }

        h1.app-title {
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
        }

        /* --- PREVIEW SECTION (TOP) --- */
        .preview-section {
            margin-bottom: 30px;
            border-bottom: 1px solid #3a3a45;
            padding-bottom: 20px;
        }

        .preview-label {
            font-size: 14px;
            margin-bottom: 10px;
            color: var(--accent);
            text-align: center;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-wrapper {
            margin-bottom: 25px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6);
            border-radius: 4px;
            overflow: hidden;
        }

        .business-card {
            width: 100%;
            aspect-ratio: 1.75 / 1;
            background: #111111;
            position: relative;
            overflow: hidden;
        }

        .flower-img {
            position: absolute;
            z-index: 1;
            pointer-events: none;
        }

        .front-card .flower-img {
            top: -45%;
            left: 15%;
            width: 70%;
        }

        .back-card .flower-img {
            top: -15%;
            left: -35%;
            height: 130%;
            width: auto;
        }

        .front-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 12%;
        }

        .name-text {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(14px, 4.5vw, 22px);
            font-weight: 400;
            letter-spacing: 3px;
            color: #ffffff;
            text-transform: uppercase;
            margin: 0;
            text-align: center;
        }

        .role-text {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(14px, 4.5vw, 20px);
            color: #d8d8d8;
            margin: 4px 0 0 0;
            font-weight: normal;
            text-align: center;
        }

        .back-content {
            position: absolute;
            inset: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-left: 35%;
            width: 60%;
        }

        .book-now {
            font-family: 'Alex Brush', cursive;
            font-size: clamp(20px, 7vw, 32px);
            color: #ffffff;
            margin: 0 0 12px 0;
            font-weight: normal;
        }

        .details-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            width: 100%;
        }

        .details-text div {
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(8px, 2.5vw, 12px);
            font-weight: 300;
            color: #ffffff;
            text-align: center;
        }

        /* --- EDITOR SECTION (BOTTOM) --- */
        .editor-section {
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            margin-bottom: 6px;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #3a3a45;
            background: var(--input-bg);
            color: white;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--accent);
        }

        input[type="file"] {
            padding: 9px 12px;
            background: #23232b;
        }

        /* --- BUTTONS --- */
        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .btn {
            flex: 1;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background: linear-gradient(135deg, #9b51e0, #6bb5ff);
            color: white;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(155, 81, 224, 0.3);
            transition: transform 0.1s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <h1 class="app-title">Card Creator</h1>

    <div class="preview-section">
        <div class="preview-label">Live Preview - Front</div>
        <div class="card-wrapper">
            <div id="card-front" class="business-card front-card">
                <img id="img-front" class="flower-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b873ff' opacity='0.5'/><text x='50' y='55' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>Upload Flower</text></svg>" alt="Flower">
                <div class="front-content">
                    <h1 id="out-name" class="name-text">ELIZABETH MONROE</h1>
                    <h2 id="out-role" class="role-text">Hair Stylist & Makeup Artist</h2>
                </div>
            </div>
        </div>

        <div class="preview-label">Live Preview - Back</div>
        <div class="card-wrapper">
            <div id="card-back" class="business-card back-card">
                <img id="img-back" class="flower-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b873ff' opacity='0.5'/><text x='50' y='55' font-family='Arial' font-size='10' fill='white' text-anchor='middle'>Upload Flower</text></svg>" alt="Flower">
                <div class="back-content">
                    <h2 class="book-now">Book Now</h2>
                    <div class="details-text">
                        <div id="out-email">ElizabethMonroe@email.com</div>
                        <div id="out-website">ElizabethMonroe.com</div>
                        <div id="out-phone">312-555-5213</div>
                        <div id="out-address">927 Broadway, Aurora</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-section">
        <div class="input-group">
            <label>Upload Transparent Flower (PNG)</label>
            <input type="file" id="flower-upload" accept="image/png">
        </div>

        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="in-name" value="ELIZABETH MONROE">
        </div>

        <div class="input-group">
            <label>Role / Subtitle</label>
            <input type="text" id="in-role" value="Hair Stylist & Makeup Artist">
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="text" id="in-email" value="ElizabethMonroe@email.com">
        </div>

        <div class="input-group">
            <label>Website</label>
            <input type="text" id="in-website" value="ElizabethMonroe.com">
        </div>

        <div class="input-group">
            <label>Phone Number</label>
            <input type="text" id="in-phone" value="312-555-5213">
        </div>

        <div class="input-group">
            <label>Address</label>
            <input type="text" id="in-address" value="927 Broadway, Aurora">
        </div>
    </div>

    <div class="btn-row">
        <button class="btn" onclick="saveImage('card-front', 'Front-Card.png')">Save Front</button>
        <button class="btn" onclick="saveImage('card-back', 'Back-Card.png')">Save Back</button>
    </div>

    <script>
        // Real-time Text Binding
        const fields = ['name', 'role', 'email', 'website', 'phone', 'address'];
        
        fields.forEach(field => {
            const input = document.getElementById(`in-${field}`);
            const output = document.getElementById(`out-${field}`);
            
            input.addEventListener('input', (e) => {
                output.textContent = e.target.value;
            });
        });

        // Handle Image Upload
        document.getElementById('flower-upload').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const imgDataUrl = event.target.result;
                    document.getElementById('img-front').src = imgDataUrl;
                    document.getElementById('img-back').src = imgDataUrl;
                }
                reader.readAsDataURL(file);
            }
        });

        // Handle Image Saving via html2canvas
        function saveImage(cardId, filename) {
            const cardElement = document.getElementById(cardId);
            
            // Temporarily disable border radius for a clean cut edge on the download
            const originalRadius = cardElement.parentElement.style.borderRadius;
            cardElement.parentElement.style.borderRadius = "0";

            html2canvas(cardElement, {
                scale: 3, // Multiplier for high resolution output
                backgroundColor: "#111111", // Fallback color
                useCORS: true,
                logging: false
            }).then(canvas => {
                // Restore wrapper formatting
                cardElement.parentElement.style.borderRadius = originalRadius;

                const imageURI = canvas.toDataURL("image/png");
                
                const link = document.createElement('a');
                link.download = filename;
                link.href = imageURI;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        }
    </script>
</body>
</html>
