<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Business Card Designer</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient-start: #111216;
      --bg-gradient-end: #1d1f27;
      --panel-bg: rgba(30, 32, 42, 0.75);
      --input-bg: #262935;
      --border-color: #363a4a;
      --text-main: #ffffff;
      --text-muted: #8e94a6;
      --accent-color: #8da452;
      
      /* Business Card Colors */
      --card-dark-green: #122a16;
      --card-light-olive: #8da452;
      --card-fold-olive: #607234;
      --card-white: #ffffff;
      --card-text-dark: #2c302e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body, html {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Main Container Layout optimized for App Webview */
    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
    }

    /* --- TOP PREVIEW SECTION --- */
    .preview-section {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    /* Segmented Toggle Switch */
    .toggle-container {
      display: flex;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      width: 220px;
    }

    .toggle-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 0;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: var(--accent-color);
      color: var(--card-dark-green);
    }

    /* Card Workspace Aspect Ratios */
    .card-viewport {
      width: 350px;
      height: 200px;
      position: relative;
      perspective: 1000px;
    }

    .business-card {
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: none;
      background: white;
    }

    .business-card.active {
      display: block;
    }

    /* --- FRONT CARD STYLES (MATCHING PROVIDED IMAGE) --- */
    .card-front {
      background: var(--card-white);
    }

    .front-left {
      width: 45%;
      height: 100%;
      background-color: var(--card-dark-green);
      float: left;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      color: var(--card-white);
    }

    .front-left .name {
      color: var(--card-light-olive);
      font-size: 17px;
      font-weight: 700;
      text-align: center;
      line-height: 1.2;
    }

    .front-left .title {
      font-size: 9px;
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 2px;
      opacity: 0.9;
    }

    .front-left .line {
      width: 16px;
      height: 1px;
      background-color: var(--card-light-olive);
      margin: 6px 0 14px 0;
    }

    .front-left .company {
      font-size: 13px;
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    /* Vertical Ribbon Feature */
    .ribbon-vertical {
      position: absolute;
      left: calc(45% - 10px);
      top: 22px;
      bottom: 22px;
      width: 24px;
      background: var(--card-light-olive);
      border-top-right-radius: 10px;
      border-bottom-right-radius: 10px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 12px 0;
    }

    .ribbon-fold-top {
      position: absolute;
      top: 16px;
      left: calc(45% - 15px);
      width: 6px;
      height: 6px;
      background: var(--card-fold-olive);
      border-radius: 3px 0 0 3px;
      z-index: 4;
    }

    .ribbon-fold-bottom {
      position: absolute;
      bottom: 16px;
      left: calc(45% - 15px);
      width: 6px;
      height: 6px;
      background: var(--card-fold-olive);
      border-radius: 3px 0 0 3px;
      z-index: 4;
    }

    .ribbon-icon {
      width: 11px;
      height: 11px;
      fill: var(--card-white);
    }

    .front-right {
      width: 55%;
      height: 100%;
      float: right;
      padding: 20px 10px 20px 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      box-sizing: border-box;
    }

    .contact-row {
      display: flex;
      align-items: center;
      height: 32px;
      border-bottom: 1px solid #eef0ed;
    }

    .contact-row:last-child {
      border-bottom: none;
    }

    .contact-text {
      font-size: 9.5px;
      color: var(--card-text-dark);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-left: 4px;
    }

    /* --- BACK CARD STYLES (MATCHING PROVIDED IMAGE) --- */
    .card-back {
      background: var(--card-white);
      display: none;
    }

    .card-back.active {
      display: block;
    }

    .back-center {
      height: calc(100% - 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .back-center .company {
      color: #000000;
      font-size: 18px;
      font-weight: 800;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    .back-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      background: var(--card-dark-green);
    }

    .back-ribbon {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-light-olive);
      height: 22px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px 6px 0 0;
      z-index: 5;
    }

    .back-ribbon-text {
      font-size: 9px;
      color: var(--card-dark-green);
      font-weight: 600;
    }

    .back-fold-left {
      position: absolute;
      bottom: 0;
      left: calc(50% - 82px);
      width: 6px;
      height: 6px;
      background: var(--card-fold-olive);
      border-radius: 3px 3px 0 0;
      z-index: 4;
      display: none; /* Auto-managed fallback sizing if needed */
    }

    /* --- BOTTOM EDITOR SECTION --- */
    .editor-section {
      flex: 1;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .editor-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-main);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-group input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-group input:focus {
      border-color: var(--accent-color);
    }

    /* Floating Action Save Button */
    .save-button {
      background: var(--accent-color);
      color: var(--card-dark-green);
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(141, 164, 82, 0.3);
    }

    .save-button:active {
      transform: scale(0.98);
    }

    /* Custom Flower Design SVG styling */
    .flower-icon {
      width: 32px;
      height: 32px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <div class="preview-section">
      <div class="toggle-container">
        <button class="toggle-btn active" onclick="switchSide('front')">Front Side</button>
        <button class="toggle-btn" onclick="switchSide('back')">Back Side</button>
      </div>
      
      <div class="card-viewport">
        <div id="card-front-view" class="business-card card-front active">
          <div class="front-left">
            <div class="name data-name">Avery Davis</div>
            <div class="title data-title">Director</div>
            <div class="line"></div>
            <svg class="flower-icon" viewBox="0 0 100 100">
              <g transform="translate(50,50)" fill="#8da452">
                <ellipse cx="0" cy="-22" rx="8" ry="18" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(45)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(90)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(135)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(180)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(225)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(270)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(315)" />
              </g>
            </svg>
            <div class="company data-company">Larana, Inc.</div>
          </div>
          
          <div class="ribbon-fold-top"></div>
          <div class="ribbon-vertical">
            <svg class="ribbon-icon" viewBox="0 0 24 24"><path d="M6.62 10.79a15.15 15.15 0 0 0 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
            <svg class="ribbon-icon" viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.3.79 2.51 1.38 3.56A8.03 8.03 0 0 1 5.08 16zm2.95-8H5.08a8.03 8.03 0 0 1 4.33-3.56A15.65 15.65 0 0 0 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zM14.34 14H9.66c-.09-.66-.16-1.32-.16-2 0-.68.07-1.35.16-2h4.68c.09.65.16 1.32.16 2 0 .67-.07 1.34-.16 2zm.25 5.56c.59-1.05 1.06-2.26 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
            <svg class="ribbon-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          </div>
          <div class="ribbon-fold-bottom"></div>

          <div class="front-right">
            <div class="contact-row">
              <div class="contact-text data-phone">+123-456-7890</div>
            </div>
            <div class="contact-row">
              <div class="contact-text data-web">www.reallygreatsite.com</div>
            </div>
            <div class="contact-row">
              <div class="contact-text data-address">123 Anywhere St., Any City</div>
            </div>
          </div>
        </div>

        <div id="card-back-view" class="business-card card-back">
          <div class="back-center">
            <svg class="flower-icon" viewBox="0 0 100 100">
              <g transform="translate(50,50)" fill="#8da452">
                <ellipse cx="0" cy="-22" rx="8" ry="18" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(45)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(90)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(135)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(180)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(225)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(270)" />
                <ellipse cx="0" cy="-22" rx="8" ry="18" transform="rotate(315)" />
              </g>
            </svg>
            <div class="company data-company">Larana, Inc.</div>
          </div>
          <div class="back-bottom-bar"></div>
          <div class="back-ribbon">
            <div class="back-ribbon-text data-web-clean">reallygreatsite.com</div>
          </div>
        </div>
      </div>
    </div>

    <div class="editor-section">
      <div class="editor-title">Card Elements</div>
      
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="input-name" value="Avery Davis">
      </div>
      
      <div class="input-group">
        <label>Job Designation</label>
        <input type="text" id="input-title" value="Director">
      </div>

      <div class="input-group">
        <label>Company Name</label>
        <input type="text" id="input-company" value="Larana, Inc.">
      </div>
      
      <div class="input-group">
        <label>Phone Number</label>
        <input type="text" id="input-phone" value="+123-456-7890">
      </div>
      
      <div class="input-group">
        <label>Website URL</label>
        <input type="text" id="input-web" value="www.reallygreatsite.com">
      </div>
      
      <div class="input-group">
        <label>Office Address</label>
        <input type="text" id="input-address" value="123 Anywhere St., Any City">
      </div>
      
      <button class="save-button" onclick="exportCardImage()">
        <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        Save Card Image
      </button>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <script>
    // State Tracker
    let currentSide = 'front';

    // Elements Selectors map
    const inputs = {
      name: document.getElementById('input-name'),
      title: document.getElementById('input-title'),
      company: document.getElementById('input-company'),
      phone: document.getElementById('input-phone'),
      web: document.getElementById('input-web'),
      address: document.getElementById('input-address')
    };

    // Live Reflection Logic
    function updatePreview() {
      // Name
      document.querySelectorAll('.data-name').forEach(el => el.innerText = inputs.name.value);
      // Designation
      document.querySelectorAll('.data-title').forEach(el => el.innerText = inputs.title.value);
      // Company name handles both targets
      document.querySelectorAll('.data-company').forEach(el => el.innerText = inputs.company.value);
      // Phone
      document.querySelectorAll('.data-phone').forEach(el => el.innerText = inputs.phone.value);
      // Web URLs
      document.querySelectorAll('.data-web').forEach(el => el.innerText = inputs.web.value);
      
      // Sanitized clean web output for back banner layout
      const cleanWeb = inputs.web.value.replace(/^(https?:\/\/)?(www\.)?/, '');
      document.querySelectorAll('.data-web-clean').forEach(el => el.innerText = cleanWeb);
      
      // Address
      document.querySelectorAll('.data-address').forEach(el => el.innerText = inputs.address.value);
    }

    // Attach Event Handlers
    Object.keys(inputs).forEach(key => {
      inputs[key].addEventListener('input', updatePreview);
    });

    // View State Toggler Switcher
    function switchSide(side) {
      currentSide = side;
      const toggleBtns = document.querySelectorAll('.toggle-btn');
      const frontCard = document.getElementById('card-front-view');
      const backCard = document.getElementById('card-back-view');

      toggleBtns.forEach(btn => btn.classList.remove('active'));

      if (side === 'front') {
        toggleBtns[0].classList.add('active');
        frontCard.classList.add('active');
        backCard.classList.remove('active');
      } else {
        toggleBtns[1].classList.add('active');
        frontCard.classList.remove('active');
        backCard.classList.add('active');
      }
    }

    // High-Resolution Rendering and Export Action
    function exportCardImage() {
      const activeCardId = currentSide === 'front' ? 'card-front-view' : 'card-back-view';
      const targetElement = document.getElementById(activeCardId);

      // Scale multiplier set to 4x for crystal clear asset generation
      html2canvas(targetElement, {
        scale: 4,
        useCORS: true,
        logging: false,
        backgroundColor: null
      }).then(canvas => {
        const imageURL = canvas.toDataURL('image/png');
        
        // Native Webview fallback download approach
        const downloadLink = document.createElement('a');
        downloadLink.download = `${inputs.name.value.replace(/\s+/g, '_')}_card_${currentSide}.png`;
        downloadLink.href = imageURL;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      }).catch(err => {
        console.error("Error standardizing image export: ", err);
      });
    }

    // Initialize layout defaults on start
    updatePreview();
  </script>
</body>
</html>
