<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --app-bg-top: #1e2235;
            --app-bg-bottom: #0b0d14;
            --primary-green: #6bc235;
            --card-dark: #0b101a;
            --input-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, var(--app-bg-top) 0%, var(--app-bg-bottom) 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- PREVIEW AREA (TOP) --- */
        .preview-section {
            flex: 0 0 auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .tabs {
            display: flex;
            width: 100%;
            max-width: 350px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .tab-btn.active {
            background: var(--primary-green);
            color: #000;
        }

        .card-scale-wrapper {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 1.75; /* 700x400 */
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        .card-side {
            display: none;
            width: 100%;
            height: 100%;
        }

        .card-side.active {
            display: block;
        }

        /* Fixed Dimensions for accurate layout + html2canvas export */
        .card-inner {
            width: 700px;
            height: 400px;
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: top left;
            background: var(--card-dark);
            overflow: hidden;
        }

        /* --- CARD DESIGN ELEMENTS --- */
        
        /* Front Card */
        .f-bg-slash {
            position: absolute;
            width: 150%;
            height: 100%;
            background: #060a12;
            left: 45%;
            top: 0;
            transform: skewX(-25deg);
        }
        .f-green-line {
            position: absolute;
            width: 15px;
            height: 120%;
            background: var(--primary-green);
            left: 45%;
            top: -10%;
            transform: skewX(-25deg);
        }
        .f-left-title {
            position: absolute;
            bottom: 110px;
            left: 40px;
            font-size: 26px;
            font-weight: 600;
            color: #fff;
            letter-spacing: 1px;
        }
        .f-green-bar {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 320px;
            height: 40px;
            background: var(--primary-green);
            clip-path: polygon(0 0, 100% 0, 92% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding-left: 40px;
            color: #000;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 2px;
        }
        .f-logo-area {
            position: absolute;
            top: 100px;
            right: 120px;
            text-align: center;
        }
        .f-logo-icon {
            width: 60px;
            height: 60px;
            border: 8px solid var(--primary-green);
            border-radius: 12px;
            transform: rotate(45deg);
            margin: 0 auto 30px auto;
            position: relative;
        }
        .f-logo-icon::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-top: 6px solid var(--primary-green);
            border-right: 6px solid var(--primary-green);
            top: 15px;
            left: 15px;
            transform: rotate(-45deg);
            border-radius: 2px;
        }
        .f-logo-title {
            color: #fff;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 5px;
        }
        .f-logo-tagline {
            color: #888;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
        }

        /* Back Card */
        .b-white-bg {
            position: absolute;
            left: 0;
            top: 0;
            width: 48%;
            height: 100%;
            background: #f4f5f7;
            clip-path: polygon(0 0, 100% 0, 80% 100%, 0 100%);
        }
        .b-qr-box {
            position: absolute;
            top: 60px;
            left: 60px;
            width: 120px;
            height: 120px;
            background: #fff;
            padding: 5px;
        }
        .b-qr-box img {
            width: 100%;
            height: 100%;
        }
        .b-left-desc {
            position: absolute;
            bottom: 40px;
            left: 0;
            width: 42%;
            height: 120px;
            background: linear-gradient(90deg, #7ad541, #5da72e);
            clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
            display: flex;
            align-items: center;
            padding: 0 40px 0 30px;
        }
        .b-left-desc p {
            color: #0b101a;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
        }
        .b-name-bar {
            position: absolute;
            top: 120px;
            right: 0;
            width: 58%;
            height: 80px;
            background: var(--primary-green);
            clip-path: polygon(10% 0, 100% 0, 100% 100%, 0 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-left: 60px;
        }
        .b-name {
            color: #fff;
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 2px;
        }
        .b-role {
            color: #0b101a;
            font-size: 13px;
            font-weight: 700;
        }
        .b-contact-list {
            position: absolute;
            bottom: 40px;
            right: 60px;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .b-contact-list li {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #fff;
            font-weight: 500;
        }
        .b-contact-list i {
            width: 25px;
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        /* --- EDITOR AREA (BOTTOM) --- */
        .editor-section {
            flex: 1 1 auto;
            overflow-y: auto;
            padding: 20px;
        }

        .editor-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .editor-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .input-group input, .input-group textarea {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus, .input-group textarea:focus {
            border-color: var(--primary-green);
            background: rgba(255,255,255,0.1);
        }

        .input-group textarea {
            resize: none;
            height: 80px;
        }

        /* --- ACTION BAR --- */
        .action-bar {
            padding: 15px 20px 25px 20px;
            background: var(--app-bg-bottom);
            border-top: 1px solid var(--border-color);
        }

        .btn-save {
            width: 100%;
            background: var(--primary-green);
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="preview-section">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchSide('front')">Front Side</button>
            <button class="tab-btn" onclick="switchSide('back')">Back Side</button>
        </div>
        
        <div class="card-scale-wrapper" id="card-wrapper">
            
            <div class="card-side active" id="view-front">
                <div class="card-inner" id="export-front">
                    <div class="f-bg-slash"></div>
                    <div class="f-green-line"></div>
                    
                    <div class="f-left-title" id="out-f-title">Lorem Ipsum Dolor</div>
                    <div class="f-green-bar" id="out-f-tags">DESIGN | BRAND | LOREM</div>
                    
                    <div class="f-logo-area">
                        <div class="f-logo-icon"></div>
                        <div class="f-logo-title" id="out-f-brand">DESIGN</div>
                        <div class="f-logo-tagline" id="out-f-tagline">TAGLINE SPACE</div>
                    </div>
                </div>
            </div>

            <div class="card-side" id="view-back">
                <div class="card-inner" id="export-back">
                    <div class="b-white-bg"></div>
                    
                    <div class="b-qr-box">
                        <img id="out-b-qr" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=www.websiteaddress.com" crossorigin="anonymous" alt="QR Code">
                    </div>
                    
                    <div class="b-left-desc">
                        <p id="out-b-desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</p>
                    </div>

                    <div class="b-name-bar">
                        <div class="b-name" id="out-b-name">JOHN DOE</div>
                        <div class="b-role" id="out-b-role">Co-Founder Brand Name</div>
                    </div>

                    <ul class="b-contact-list">
                        <li><i class="fas fa-map-marker-alt"></i> <span id="out-b-address">123 Dummy, Lorem Ipsum</span></li>
                        <li><i class="fas fa-phone-alt"></i> <span id="out-b-phone">+00 1234 5XXX 9012</span></li>
                        <li><i class="fas fa-envelope"></i> <span id="out-b-email">info@email space</span></li>
                        <li><i class="fas fa-mouse-pointer"></i> <span id="out-b-website">www.websiteaddress.com</span></li>
                    </ul>
                </div>
            </div>

        </div>
    </div>

    <div class="editor-section">
        
        <div class="editor-form active" id="form-front">
            <div class="input-group">
                <label>Company / Brand Name</label>
                <input type="text" id="in-f-brand" value="DESIGN">
            </div>
            <div class="input-group">
                <label>Tagline</label>
                <input type="text" id="in-f-tagline" value="TAGLINE SPACE">
            </div>
            <div class="input-group">
                <label>Left Main Title</label>
                <input type="text" id="in-f-title" value="Lorem Ipsum Dolor">
            </div>
            <div class="input-group">
                <label>Left Bottom Tags</label>
                <input type="text" id="in-f-tags" value="DESIGN | BRAND | LOREM">
            </div>
        </div>

        <div class="editor-form" id="form-back">
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="in-b-name" value="JOHN DOE">
            </div>
            <div class="input-group">
                <label>Job Title / Role</label>
                <input type="text" id="in-b-role" value="Co-Founder Brand Name">
            </div>
            <div class="input-group">
                <label>Address</label>
                <input type="text" id="in-b-address" value="123 Dummy, Lorem Ipsum">
            </div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="in-b-phone" value="+00 1234 5XXX 9012">
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="text" id="in-b-email" value="info@email space">
            </div>
            <div class="input-group">
                <label>Website (Auto Updates QR Code)</label>
                <input type="text" id="in-b-website" value="www.websiteaddress.com">
            </div>
            <div class="input-group">
                <label>Left Description Paragraph</label>
                <textarea id="in-b-desc">Lorem ipsum dolor sit amet, consectetur adipiscing elit.</textarea>
            </div>
        </div>

    </div>

    <div class="action-bar">
        <button class="btn-save" onclick="saveActiveCard()">
            <i class="fas fa-download"></i> Save Image
        </button>
    </div>

    <script>
        let currentSide = 'front';

        // 1. Scale Card to fit the Mobile Preview Container
        function scaleCard() {
            const wrapper = document.getElementById('card-wrapper');
            const innerCards = document.querySelectorAll('.card-inner');
            const scale = wrapper.clientWidth / 700; // 700 is the native card width
            innerCards.forEach(card => {
                card.style.transform = `scale(${scale})`;
            });
        }

        window.addEventListener('resize', scaleCard);
        window.addEventListener('load', scaleCard);

        // 2. Tab Switching Logic
        function switchSide(side) {
            currentSide = side;
            
            // Toggle Buttons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            // Toggle Card Previews
            document.querySelectorAll('.card-side').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${side}`).classList.add('active');

            // Toggle Editor Forms
            document.querySelectorAll('.editor-form').forEach(el => el.classList.remove('active'));
            document.getElementById(`form-${side}`).classList.add('active');
        }

        // 3. Two-Way Data Binding Helper
        function bindData(inputId, outputId) {
            const inputEl = document.getElementById(inputId);
            const outputEl = document.getElementById(outputId);
            
            inputEl.addEventListener('input', (e) => {
                outputEl.innerText = e.target.value;
                
                // Special case for Website -> Update QR Code
                if(inputId === 'in-b-website') {
                    const qrImg = document.getElementById('out-b-qr');
                    const url = encodeURIComponent(e.target.value || ' ');
                    qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${url}`;
                }
            });
        }

        // Initialize bindings for Front
        bindData('in-f-brand', 'out-f-brand');
        bindData('in-f-tagline', 'out-f-tagline');
        bindData('in-f-title', 'out-f-title');
        bindData('in-f-tags', 'out-f-tags');

        // Initialize bindings for Back
        bindData('in-b-name', 'out-b-name');
        bindData('in-b-role', 'out-b-role');
        bindData('in-b-address', 'out-b-address');
        bindData('in-b-phone', 'out-b-phone');
        bindData('in-b-email', 'out-b-email');
        bindData('in-b-website', 'out-b-website');
        bindData('in-b-desc', 'out-b-desc');

        // 4. Save Image Logic utilizing HTML2Canvas
        function saveActiveCard() {
            const btn = document.querySelector('.btn-save');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            
            // Get currently visible card inner container
            const activeCard = document.getElementById(`export-${currentSide}`);
            
            // Temporarily reset scaling so html2canvas renders the exact 700x400 high-res format
            activeCard.style.transform = 'scale(1)';

            html2canvas(activeCard, {
                scale: 2, // 2x scale for better image quality
                useCORS: true, // Necessary to capture external images like the QR code API
                backgroundColor: null
            }).then(canvas => {
                // Restore UI scale
                scaleCard();
                
                // Trigger Download
                let link = document.createElement('a');
                link.download = `business-card-${currentSide}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                btn.innerHTML = originalText;
            }).catch(err => {
                scaleCard(); // restore scale if fails
                alert('Error generating image. Ensure internet is connected for QR load.');
                btn.innerHTML = originalText;
            });
        }
    </script>
</body>
</html>
