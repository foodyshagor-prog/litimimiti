<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Business Card Maker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f0f12 0%, #18181f 100%);
            --panel-bg: #1f1f26;
            --input-bg: #282833;
            --accent-orange: #ff9200;
            --text-main: #ffffff;
            --text-muted: #a0a0ab;
            --card-width: 350px;
            --card-height: 200px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
        }

        /* --- PREVIEW CONTAINER (TOP - FIXED SIZE) --- */
        .preview-viewport {
            flex-shrink: 0;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .view-toggle {
            display: flex;
            background: var(--panel-bg);
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 80%;
            max-width: 280px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent-orange);
            color: #000000;
        }

        /* --- CARD CANVAS LAYOUTS --- */
        .card-wrapper {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        .card-wrapper.active {
            display: block;
        }

        .card-stage {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Front Side Details */
        .front-web {
            position: absolute;
            left: 24px;
            top: 100px;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .center-brand {
            position: absolute;
            left: 265px;
            top: 100px;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px;
            text-align: center;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 800;
            margin-top: 6px;
            line-height: 1.2;
        }

        .brand-tagline {
            font-size: 8px;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        /* Back Side Details */
        .back-holder {
            position: absolute;
            left: 24px;
            top: 24px;
        }

        .holder-name {
            font-size: 18px;
            font-weight: 700;
            color: #ffffff;
        }

        .holder-title {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        .back-contact-list {
            position: absolute;
            left: 24px;
            bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-icon-box {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-details {
            display: flex;
            flex-direction: column;
        }

        .contact-label {
            font-size: 7px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: capitalize;
            line-height: 1;
        }

        .contact-value {
            font-size: 8.5px;
            color: #ffffff;
            font-weight: 500;
            margin-top: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 1px;
            min-width: 90px;
        }

        /* --- EDITOR PANEL (BOTTOM - SCROLLABLE) --- */
        .editor-panel {
            flex-grow: 1;
            min-height: 0;
            background: var(--panel-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .editor-section-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-orange);
            font-weight: 700;
            border-left: 3px solid var(--accent-orange);
            padding-left: 8px;
            margin-bottom: 4px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-row {
            display: flex;
            gap: 12px;
        }

        label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent-orange);
        }

        /* --- EXPORT ACTION BUTTON --- */
        .save-btn {
            background: var(--accent-orange);
            color: #000000;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 15px;
            font-weight: 700;
            margin-top: 10px;
            margin-bottom: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 146, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .save-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="preview-viewport">
        <div class="view-toggle">
            <button class="toggle-btn active" id="toggle-front" onclick="changeSide('front')">Front Design</button>
            <button class="toggle-btn" id="toggle-back" onclick="changeSide('back')">Back Design</button>
        </div>

        <div class="card-wrapper active" id="render-front">
            <div class="card-stage">
                <svg class="card-bg" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <rect width="350" height="200" fill="#141416"/>
                    <path d="M 0,85 L 175,85 C 205,85 208,25 265,25 C 322,25 360,58 360,100 C 360,142 322,175 265,175 C 208,175 205,115 175,115 L 0,115 Z" fill="#ff9200"/>
                    <circle cx="265" cy="100" r="54" fill="#141416"/>
                </svg>
                <div class="card-content">
                    <div class="front-web UI-bind-web">Yourwebsite.com</div>
                    <div class="center-brand">
                        <svg width="32" height="32" viewBox="0 0 40 40">
                            <path d="M 13,7 A 15,15 0 0,0 13,33" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                            <path d="M 27,7 A 15,15 0 0,1 27,33" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                            <circle cx="20" cy="20" r="5.5" fill="#ff9200"/>
                        </svg>
                        <div class="brand-title"><span class="UI-bind-c1">Company</span> <span class="UI-bind-c2" style="color:var(--accent-orange)">Name</span></div>
                        <div class="brand-tagline UI-bind-tag">Tagline Here</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-wrapper" id="render-back">
            <div class="card-stage">
                <svg class="card-bg" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <rect width="350" height="200" fill="#141416"/>
                    <path d="M 0,185 L 185,185 C 210,185 210,25 265,25 C 320,25 360,58 360,100 L 360,200 L 0,200 Z" fill="#ff9200"/>
                    <circle cx="265" cy="100" r="54" fill="#141416"/>
                </svg>
                <div class="card-content">
                    <div class="back-holder">
                        <div class="holder-name"><span class="UI-bind-fn">Dicky</span> <span class="UI-bind-ln" style="color:#fff">Prayuda</span></div>
                        <div class="holder-title UI-bind-title">Graphic Designer</div>
                    </div>
                    
                    <div class="back-contact-list">
                        <div class="contact-item">
                            <div class="contact-icon-box">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--accent-orange)"><path d="M20 22.6c-2.7 0-5.8-1.1-8.9-3.1-3.1-2-5.7-4.7-7.6-7.6C1.4 8.7.3 5.7.3 3c0-1.5.6-2.4 1.7-2.8L5.4.3c.7-.3 1.6 0 2 .8l2 3.8c.3.6.1 1.4-.4 1.9L7.8 8c1.3 2 2.9 3.6 4.9 4.9l1.2-1.2c.5-.5 1.3-.7 1.9-.4l3.8 2c.8.4 1.1 1.3.8 2l-1 3.4c-.3 1.1-1.3 1.9-2.9 1.9z"/></svg>
                            </div>
                            <div class="contact-details">
                                <span class="contact-label">Phone</span>
                                <span class="contact-value UI-bind-phone">+00 1234 56789</span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon-box">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--accent-orange)"><path d="M22 4H2c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-10 6.25L2 8V6l10 6.25L22 6v2z"/></svg>
                            </div>
                            <div class="contact-details">
                                <span class="contact-label">Email</span>
                                <span class="contact-value UI-bind-email">info@example.com</span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon-box">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--accent-orange)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            </div>
                            <div class="contact-details">
                                <span class="contact-label">Location</span>
                                <span class="contact-value UI-bind-loc">Address here, City, 1234</span>
                            </div>
                        </div>
                        <div class="contact-item">
                            <div class="contact-icon-box">
                                <svg width="11" height="11" viewBox="0 0 24 24" fill="var(--accent-orange)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            </div>
                            <div class="contact-details">
                                <span class="contact-label">Website</span>
                                <span class="contact-value UI-bind-web">Yourwebsite.com</span>
                            </div>
                        </div>
                    </div>

                    <div class="center-brand">
                        <svg width="32" height="32" viewBox="0 0 40 40">
                            <path d="M 13,7 A 15,15 0 0,0 13,33" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                            <path d="M 27,7 A 15,15 0 0,1 27,33" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none"/>
                            <circle cx="20" cy="20" r="5.5" fill="#ff9200"/>
                        </svg>
                        <div class="brand-title"><span class="UI-bind-c1">Company</span> <span class="UI-bind-c2" style="color:var(--accent-orange)">Name</span></div>
                        <div class="brand-tagline UI-bind-tag">Tagline Here</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-panel">
        
        <div class="editor-section">
            <div class="editor-section-title">Brand Layout</div>
            <div class="input-row">
                <div class="input-group" style="flex:1;">
                    <label>Company Word 1</label>
                    <input type="text" id="in-c1" value="Company">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Company Word 2</label>
                    <input type="text" id="in-c2" value="Name">
                </div>
            </div>
            <div class="input-group">
                <label>Tagline</label>
                <input type="text" id="in-tag" value="Tagline Here">
            </div>
        </div>

        <div class="editor-section">
            <div class="editor-section-title">Personal Profile</div>
            <div class="input-row">
                <div class="input-group" style="flex:1;">
                    <label>First Name</label>
                    <input type="text" id="in-fn" value="Dicky">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Last Name</label>
                    <input type="text" id="in-ln" value="Prayuda">
                </div>
            </div>
            <div class="input-group">
                <label>Professional Title</label>
                <input type="text" id="in-title" value="Graphic Designer">
            </div>
        </div>

        <div class="editor-section">
            <div class="editor-section-title">Contact Coordinates</div>
            <div class="input-group">
                <label>Phone Number</label>
                <input type="text" id="in-phone" value="+00 1234 56789">
            </div>
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="in-email" value="info@example.com">
            </div>
            <div class="input-group">
                <label>Location Map Address</label>
                <input type="text" id="in-loc" value="Address here, City, 1234">
            </div>
            <div class="input-group">
                <label>Web Domain Link</label>
                <input type="text" id="in-web" value="Yourwebsite.com">
            </div>
        </div>

        <button class="save-btn" onclick="exportCardImage()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save Combined Image
        </button>
    </div>

    <script>
        let currentSide = 'front';

        function changeSide(side) {
            currentSide = side;
            document.querySelectorAll('.card-wrapper').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(el => el.classList.remove('active'));
            
            if(side === 'front') {
                document.getElementById('render-front').classList.add('active');
                document.getElementById('toggle-front').classList.add('active');
            } else {
                document.getElementById('render-back').classList.add('active');
                document.getElementById('toggle-back').classList.add('active');
            }
        }

        function setupLiveBindings(inputId, targetClass) {
            const inputEl = document.getElementById(inputId);
            inputEl.addEventListener('input', (e) => {
                const targets = document.querySelectorAll('.' + targetClass);
                targets.forEach(target => {
                    target.textContent = e.target.value;
                });
            });
        }

        setupLiveBindings('in-c1', 'UI-bind-c1');
        setupLiveBindings('in-c2', 'UI-bind-c2');
        setupLiveBindings('in-tag', 'UI-bind-tag');
        setupLiveBindings('in-fn', 'UI-bind-fn');
        setupLiveBindings('in-ln', 'UI-bind-ln');
        setupLiveBindings('in-title', 'UI-bind-title');
        setupLiveBindings('in-phone', 'UI-bind-phone');
        setupLiveBindings('in-email', 'UI-bind-email');
        setupLiveBindings('in-loc', 'UI-bind-loc');
        setupLiveBindings('in-web', 'UI-bind-web');

        function exportCardImage() {
            const frontElement = document.getElementById('render-front');
            const backElement = document.getElementById('render-back');
            
            // Save current visibility state
            const frontOriginalDisplay = frontElement.style.display;
            const backOriginalDisplay = backElement.style.display;

            // Temporarily force both elements to display: block so html2canvas can compute layouts
            frontElement.style.display = 'block';
            backElement.style.display = 'block';

            const renderScale = 3; // High-resolution export modifier
            const renderOptions = {
                scale: renderScale, 
                backgroundColor: null,
                logging: false,
                useCORS: true
            };

            // Capture snapshots of both layouts synchronously
            const frontCapture = html2canvas(frontElement, renderOptions);
            const backCapture = html2canvas(backElement, renderOptions);

            // Revert back immediately to keep UI visual state intact
            frontElement.style.display = frontOriginalDisplay;
            backElement.style.display = backOriginalDisplay;

            // Process canvas compiling asynchronously
            Promise.all([frontCapture, backCapture]).then(([frontCanvas, backCanvas]) => {
                const combinedCanvas = document.createElement('canvas');
                const ctx = combinedCanvas.getContext('2d');

                // Define design presentations layout spacing (proportional to renderScale)
                const paddingValue = 45 * renderScale; // Outer padding surrounding cards
                const separationGap = 35 * renderScale; // Gap separating Front and Back layouts

                const designMaxWidth = Math.max(frontCanvas.width, backCanvas.width);
                
                // Compute final image dimensions
                combinedCanvas.width = designMaxWidth + (paddingValue * 2);
                combinedCanvas.height = frontCanvas.height + backCanvas.height + separationGap + (paddingValue * 2);

                // 1. Paint background with presentation canvas gray (replicating sample provided)
                ctx.fillStyle = '#f0f2f5';
                ctx.fillRect(0, 0, combinedCanvas.width, combinedCanvas.height);

                // 2. Stitch Front Design Centered
                const frontX = (combinedCanvas.width - frontCanvas.width) / 2;
                const frontY = paddingValue;
                ctx.drawImage(frontCanvas, frontX, frontY);

                // 3. Stitch Back Design Centered Below
                const backX = (combinedCanvas.width - backCanvas.width) / 2;
                const backY = frontY + frontCanvas.height + separationGap;
                ctx.drawImage(backCanvas, backX, backY);

                // Export final presentation image asset
                const dataUrl = combinedCanvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.download = `BusinessCard_FullLayout_${Date.now()}.png`;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }).catch(err => {
                console.error("Export failure: ", err);
            });
        }
    </script>
</body>
</html>
