<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Business Card Maker</title>
    <style>
        /* Modern Dark Gradient UI Framework */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #111115 0%, #1a1a24 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Fixed App Header */
        .app-header {
            padding: 14px 16px;
            background: rgba(20, 20, 27, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f8fafc;
        }

        /* Preview Top Area */
        .preview-section {
            background: rgba(10, 10, 14, 0.4);
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Toggle Control & Action Buttons */
        .control-row {
            display: flex;
            width: 100%;
            max-width: 360px;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
        }

        .toggle-container {
            background: #27273a;
            padding: 4px;
            border-radius: 30px;
            display: flex;
            position: relative;
            width: 180px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 0;
            font-size: 12px;
            font-weight: 600;
            color: #94a3b8;
            background: transparent;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s ease;
        }

        .toggle-btn.active {
            color: #ffffff;
        }

        .toggle-slider {
            position: absolute;
            top: 4px;
            left: 4px;
            width: 86px;
            height: 30px;
            background: linear-gradient(135deg, #ff5722 0%, #ff9800 100%);
            border-radius: 25px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
            box-shadow: 0 2px 8px rgba(255, 87, 34, 0.4);
        }

        .action-btn {
            background: linear-gradient(135deg, #00b4db 0%, #0083b0 100%);
            color: #fff;
            border: none;
            padding: 10px 16px;
            border-radius: 25px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 12px rgba(0, 180, 219, 0.3);
        }

        /* --- Business Card Live Canvas Canvas/DOM Engine --- */
        .card-view-wrapper {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1.75 / 1;
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 12px;
        }

        .card-inner.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            overflow: hidden;
            background: #fff;
        }

        /* --- Card Front Design Elements --- */
        .card-front {
            background: #fffdf9;
        }

        .fluid-bg-front {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .front-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .brand-logo-container {
            text-align: center;
            margin-top: -5px;
        }

        .brand-main-title {
            font-family: 'Georgia', serif;
            font-size: 42px;
            font-weight: 900;
            font-style: italic;
            background: linear-gradient(to bottom, #ff3d00 30%, #d50000 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: -4px;
            filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.15));
        }

        .brand-sub-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
            color: #4a0e00;
            text-transform: uppercase;
        }

        .brand-tagline {
            font-size: 10px;
            font-style: italic;
            color: #d84315;
            margin-top: 6px;
            font-weight: 500;
            border-top: 1px solid rgba(216, 67, 21, 0.3);
            padding-top: 2px;
        }

        /* Food illustration layers */
        .dosa-asset {
            position: absolute;
            left: 8px;
            bottom: 24px;
            width: 82px;
            transform: rotate(-5deg);
            filter: drop-shadow(2px 4px 5px rgba(0,0,0,0.25));
        }

        .chutney-asset {
            position: absolute;
            right: 12px;
            top: 28px;
            width: 58px;
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.2));
        }

        /* --- Card Back Design Elements --- */
        .card-back {
            transform: rotateY(180deg);
            background: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }

        .fluid-bg-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .back-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .back-left-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
            max-width: 65%;
        }

        .profile-block {
            margin-bottom: 8px;
        }

        .owner-name {
            font-size: 15px;
            font-weight: 800;
            color: #e65100;
            letter-spacing: 0.3px;
        }

        .owner-role {
            font-size: 10px;
            font-weight: 600;
            color: #546e7a;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .contact-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 8px;
            color: #37474f;
            font-weight: 600;
            word-break: break-word;
        }

        .contact-icon {
            width: 13px;
            height: 13px;
            background: #d84315;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-icon svg {
            width: 7px;
            height: 7px;
            fill: #fff;
        }

        .social-row {
            display: flex;
            gap: 5px;
            margin-top: 4px;
        }

        .social-icon {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon svg {
            width: 8px;
            height: 8px;
            fill: white;
        }

        .back-right-panel {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            height: 100%;
            width: 30%;
        }

        .qr-wrapper {
            background: white;
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid #f1f5f9;
        }

        .qr-wrapper svg {
            display: block;
        }

        /* --- Bottom Editor Console Panel --- */
        .editor-section {
            flex-grow: 1;
            overflow-y: auto;
            background: #16161f;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 16px;
        }

        .editor-title {
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            margin-bottom: 16px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .editor-card {
            background: #1f1f2e;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            display: none;
        }

        .editor-card.active-panel {
            display: block;
        }

        .input-group {
            margin-bottom: 14px;
        }

        .input-group:last-child {
            margin-bottom: 0;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .input-group input {
            width: 100%;
            background: #13131a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px 12px;
            color: #f8fafc;
            font-size: 13px;
            transition: border-color 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #ff5722;
        }

        /* Hidden export container setup */
        #export-sandbox {
            position: absolute;
            left: -9999px;
            top: -9999px;
        }
    </style>
</head>

    <script>
        let currentView = 'front';

        function setView(view) {
            currentView = view;
            const card = document.getElementById('interactive-card');
            const slider = document.getElementById('slider');

            const panelFront = document.getElementById('panel-front');
            const panelBack = document.getElementById('panel-back');
            const titleIndicator = document.getElementById('panel-title-indicator');

            if(view === 'front') {
                card.classList.remove('flipped');
                slider.style.transform = 'translateX(0px)';
                btns[0].classList.add('active');
                btns[1].classList.remove('active');
                panelFront.classList.add('active-panel');
                panelBack.classList.remove('active-panel');
                titleIndicator.innerText = "Front Side Configurations";
            } else {
                card.classList.add('flipped');
                slider.style.transform = 'translateX(86px)';
                btns[0].classList.remove('active');
                btns[1].classList.add('active');
                panelFront.classList.remove('active-panel');
                panelBack.classList.add('active-panel');
                titleIndicator.innerText = "Back Side Configurations";
            }
        }

        function syncData() {
            // Live synchronizing inputs to elements
            document.getElementById('lbl-title').innerText = document.getElementById('txt-title').value;
            document.getElementById('lbl-subtitle').innerText = document.getElementById('txt-subtitle').value;
            document.getElementById('lbl-tagline').innerText = document.getElementById('txt-tagline').value;
            
            document.getElementById('lbl-name').innerText = document.getElementById('txt-name').value;
            document.getElementById('lbl-role').innerText = document.getElementById('txt-role').value;
            document.getElementById('lbl-phone').innerText = document.getElementById('txt-phone').value;
            document.getElementById('lbl-address').innerText = document.getElementById('txt-address').value;
            document.getElementById('lbl-email').innerText = document.getElementById('txt-email').value;
        }

        // Programmatic High-Resolution Canvas Export Module (Completely Native and Independent)
        function generateHighResExport() {
            const width = 1050; // High-resolution standard business card width
            const height = 600;
            
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            if (currentView === 'front') {
                // Background Clean Render Block
                ctx.fillStyle = "#fffdf9";
                ctx.fillRect(0, 0, width, height);

                // Re-rendering Background wave gradients programmatically 
                let grad = ctx.createLinearGradient(0, 0, width, height);
                grad.addColorStop(0, '#ff9100');
                grad.addColorStop(0.5, '#ff3d00');
                grad.addColorStop(1, '#b71c1c');

                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(width, 0);
                ctx.lineTo(width, height * 0.25);
                ctx.bezierCurveTo(width * 0.8, height * 0.6, width * 0.57, height * 0.3, width * 0.34, height * 0.65);
                ctx.bezierCurveTo(width * 0.14, height * 0.95, 0, height * 0.7, 0, height);
                ctx.closePath();
                ctx.fill();

                // Secondary overlapping deep shadow wave block
                ctx.fillStyle = '#b71c1c';
                ctx.globalAlpha = 0.4;
                ctx.beginPath();
                ctx.moveTo(0, height * 0.75);
                ctx.bezierCurveTo(width * 0.25, height * 0.65, width * 0.37, height * 0.97, width * 0.62, height * 0.8);
                ctx.bezierCurveTo(width * 0.82, height * 0.65, width, height * 0.87, width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // Accents rendering
                ctx.fillStyle = "#ff6d00";
                ctx.beginPath();
                ctx.arc(width * 0.1, height * 0.2, 36, 0, Math.PI * 2);
                ctx.fill();

                // Dynamic Typography Rendering
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                // Main Logo
                ctx.font = 'italic bold 110px Georgia';
                ctx.fillStyle = '#d50000';
                ctx.fillText(document.getElementById('txt-title').value, width / 2, height / 2 - 30);
                
                // Business sub title text
                ctx.font = '800 36px Helvetica';
                ctx.fillStyle = '#4a0e00';
                ctx.fillText(document.getElementById('txt-subtitle').value, width / 2, height / 2 + 50);

                // Tagline text line decoration
                ctx.font = 'italic 500 24px Georgia';
                ctx.fillStyle = '#d84315';
                ctx.fillText(document.getElementById('txt-tagline').value, width / 2, height / 2 + 110);

            } else {
                // Back Side Render Engine Block
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, width, height);

                ctx.fillStyle = "rgba(255, 109, 0, 0.1)";
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(width * 0.3, height * 0.2, width * 0.7, -height * 0.05, width, height * 0.15);
                ctx.lineTo(width, 0);
                ctx.lineTo(0, 0);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = "rgba(255, 61, 0, 0.4)";
                ctx.beginPath();
                ctx.moveTo(0, height * 0.87);
                ctx.bezierCurveTo(width * 0.31, height * 0.8, width * 0.57, height * 0.97, width, height * 0.85);
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.closePath();
                ctx.fill();

                // Profile Name details
                ctx.textAlign = 'left';
                ctx.fillStyle = '#e65100';
                ctx.font = '800 42px Helvetica';
                ctx.fillText(document.getElementById('txt-name').value, 60, 100);

                ctx.fillStyle = '#546e7a';
                ctx.font = '600 24px Helvetica';
                ctx.fillText(document.getElementById('txt-role').value.toUpperCase(), 60, 145);

                // Contact Lines Text rendering logic block
                ctx.fillStyle = '#37474f';
                ctx.font = '600 21px Helvetica';
                ctx.fillText("Phone: " + document.getElementById('txt-phone').value, 60, 260);
                ctx.fillText("Email: " + document.getElementById('txt-email').value, 60, 320);
                
                // Wrap address safely on canvas context
                let addressText = document.getElementById('txt-address').value;
                ctx.fillText("Address: " + addressText.substring(0, 45), 60, 380);
                if(addressText.length > 45) {
                    ctx.fillText(addressText.substring(45), 148, 410);
                }

                // Render Mock Stylized high res layout QR Code block matching design framework
                ctx.fillStyle = '#263238';
                let qrSize = 140;
                let qrX = width - 220;
                let qrY = height / 2 - 70;
                ctx.fillRect(qrX, qrY, qrSize, qrSize);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(qrX + 10, qrY + 10, qrSize - 20, qrSize - 20);
                
                // Add mini visual elements to mock internal QR architecture safely
                ctx.fillStyle = '#263238';
                ctx.fillRect(qrX + 20, qrY + 20, 35, 35);
                ctx.fillRect(qrX + qrSize - 55, qrY + 20, 35, 35);
                ctx.fillRect(qrX + 20, qrY + qrSize - 55, 35, 35);
                ctx.fillRect(qrX + 50, qrY + 70, 45, 45);
            }

            // Export logic pipeline to application interface context
            let imageURI = canvas.toDataURL('image/png');
            
            // Native platform callback anchor routine initialization
            let downloadLink = document.createElement('a');
            downloadLink.download = currentView + '_business_card.png';
            downloadLink.href = imageURI;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
