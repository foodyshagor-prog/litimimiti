<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Business Card Designer</title>
    <style>
        /* Modern Dark Gradient UI Wrapper */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(180deg, #141419 0%, #08080a 100%);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* App Layout Structure */
        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }

        header {
            padding: 16px;
            text-align: center;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Top Preview Area */
        .preview-area {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 12, 0.4);
            position: relative;
        }

        /* Toggle Switch Styling */
        .view-toggle {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            padding: 4px;
            border-radius: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            width: 200px;
        }

        .toggle-btn {
            flex: 1;
            padding: 8px 0;
            border: none;
            background: transparent;
            color: #a0aec0;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .toggle-btn.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
        }

        /* Card Scale Container to preserve precise ratio on mobile layouts */
        .card-container {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1.75;
            perspective: 1000px;
        }

        /* Accurate Business Card Styling */
        .business-card {
            width: 100%;
            height: 100%;
            border-radius: 14px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            display: none;
            background: #fff;
        }

        .business-card.active {
            display: block;
        }

        /* FRONT PAGE VECTOR STYLING */
        .card-front {
            background: #ffffff;
            color: #333;
        }

        .front-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .front-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .front-meta {
            align-self: flex-end;
            text-align: right;
            margin-top: 4px;
            margin-right: 12%;
        }

        .card-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a3020;
            line-height: 1.2;
        }

        .card-title {
            font-size: 0.7rem;
            font-weight: 500;
            color: #555;
            letter-spacing: 0.5px;
        }

        /* Stylized Brand Logo Graphic */
        .logo-group {
            margin-left: 10px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .logo-icon-wrap {
            border: 1.5px solid #e67e22;
            border-radius: 6px;
            padding: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .logo-icon-wrap svg {
            width: 18px;
            height: 18px;
            fill: #e67e22;
        }

        .logo-text-wrap {
            display: flex;
            flex-direction: column;
        }

        .logo-top {
            font-family: 'Georgia', cursive, serif;
            font-size: 1.3rem;
            font-style: italic;
            color: #27853c;
            line-height: 1;
            font-weight: bold;
        }

        .logo-bottom {
            font-size: 1.1rem;
            font-weight: 800;
            color: #34495e;
            letter-spacing: -0.5px;
            line-height: 0.9;
            margin-left: 8px;
        }

        /* BACK PAGE VECTOR STYLING */
        .card-back {
            background: #e2f3e5;
            color: #2c3e50;
        }

        .back-svg-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .back-content {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            padding: 16px 20px;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            align-items: end;
        }

        .back-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
            height: 100%;
            justify-content: space-between;
            padding-bottom: 4px;
        }

        .back-right {
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding-bottom: 20px;
            align-items: flex-start;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.62rem;
            font-weight: 600;
            color: #2d4030;
        }

        .contact-item svg {
            width: 10px;
            height: 10px;
            fill: #3b8853;
            flex-shrink: 0;
        }

        .address-box {
            margin-top: auto;
        }

        .qr-code-wrapper {
            background: white;
            padding: 4px;
            border-radius: 6px;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .qr-code-wrapper svg {
            width: 100%;
            height: 100%;
        }

        .web-link {
            position: absolute;
            bottom: 8px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.58rem;
            color: #d5ebd9;
            font-weight: 500;
        }

        .web-link svg {
            width: 9px;
            height: 9px;
            fill: #d5ebd9;
        }

        /* Bottom Editor Controls Panel */
        .editor-panel {
            flex: 1;
            background: #121216;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 16px;
            overflow-y: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .editor-section-title {
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #718096;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .editor-section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: #a0aec0;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            background: #1a1a22;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 0.85rem;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2ecc71;
            background: #1e1e27;
        }

        /* Action Buttons Area */
        .action-area {
            padding: 12px 16px 24px 16px;
            background: #121216;
        }

        .btn-save {
            width: 100%;
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 6px 20px rgba(46, 204, 113, 0.25);
            cursor: pointer;
        }

        .btn-save:active {
            transform: scale(0.98);
        }

        /* Hidden standard canvas for rendering export image offline */
        #export-canvas {
            display: none;
        }
    </style>
</head>

    <canvas id="export-canvas"></canvas>

    <script>
        let currentActiveSide = 'front';

        // Control Panel Switch View Engine Logic
        function switchView(side) {
            currentActiveSide = side;
            
            // Toggle Display Controls
            document.getElementById('btn-view-front').classList.toggle('active', side === 'front');
            document.getElementById('btn-view-back').classList.toggle('active', side === 'back');
            
            document.getElementById('card-front-element').classList.toggle('active', side === 'front');
            document.getElementById('card-back-element').classList.toggle('active', side === 'back');

            // Handle Input panels cross fading
            document.getElementById('editor-front-fields').style.display = side === 'front' ? 'block' : 'none';
            document.getElementById('editor-back-fields').style.display = side === 'back' ? 'block' : 'none';
        }

        // Fast DOM Field Synchronization Handler
        function updateText(elementId, value) {
            document.getElementById(`preview-${elementId}`).innerText = value;
        }

        /**
         * Independent High Fidelity Canvas Export Engine
         * Combines both front and back into a clean, presentation-ready presentation.
         */
        function exportCardToImage() {
            const canvas = document.getElementById('export-canvas');
            const ctx = canvas.getContext('2d');
            
            // Layout Specifications
            const cardW = 1050; 
            const cardH = 600;  
            const padding = 60; // Outer layout border spacing
            const gap = 50;     // Vertical spacing gap between cards
            
            // Dynamically dimension canvas to combine both surfaces centered vertically
            canvas.width = cardW + (padding * 2);
            canvas.height = (cardH * 2) + (padding * 2) + gap;
            
            // 1. Draw presentation showcase background layer
            ctx.fillStyle = "#f0f2f5";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.textBaseline = 'top';

            // Gather values directly out of current active view bindings
            const nameText = document.getElementById('preview-name').innerText;
            const titleText = document.getElementById('preview-title').innerText;
            const brandTop = document.getElementById('preview-logo-1').innerText;
            const brandBottom = document.getElementById('preview-logo-2').innerText;
            const addr1 = document.getElementById('preview-address-1').innerText;
            const addr2 = document.getElementById('preview-address-2').innerText;
            const phone = document.getElementById('preview-phone').innerText;
            const email = document.getElementById('preview-email').innerText;
            const web = document.getElementById('preview-web').innerText;

            // ----------------------------------------------------
            // RENDER BLOCK 1: FRONT SIDE (TOP ELEMENT)
            // ----------------------------------------------------
            ctx.save();
            ctx.translate(padding, padding); // Translate coordinates to top card layout zone
            
            // Draw Card Background Surface
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, cardW, cardH);

            // Setup Green Linear Wave Gradient Accent
            let gradient = ctx.createLinearGradient(0, 0, cardW, cardH);
            gradient.addColorStop(0, '#6be37b');
            gradient.addColorStop(1, '#227034');

            // Draw Wave Vector
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.moveTo(480, 600);
            ctx.bezierCurveTo(690, 510, 600, 180, 1050, 135);
            ctx.lineTo(1050, 600);
            ctx.closePath();
            ctx.fill();

            // Structural Wave Stroke Layout Layer 1
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 9;
            ctx.beginPath();
            ctx.moveTo(435, 600);
            ctx.bezierCurveTo(645, 504, 555, 174, 1050, 120);
            ctx.stroke();

            // Structural Wave Stroke Layout Layer 2
            ctx.strokeStyle = "rgba(169, 243, 181, 0.6)";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(405, 600);
            ctx.bezierCurveTo(615, 495, 525, 165, 1050, 102);
            ctx.stroke();

            // Render Name Text Block
            ctx.fillStyle = "#1a3020";
            ctx.font = "bold 38px sans-serif";
            ctx.fillText(nameText, 480, 50);

            // Render Title Text Block
            ctx.fillStyle = "#555555";
            ctx.font = "500 24px sans-serif";
            ctx.fillText(titleText, 480, 100);

            // Drawing Orange Logo Accent Outlines
            ctx.strokeStyle = "#e67e22";
            ctx.lineWidth = 4;
            ctx.strokeRect(50, 430, 65, 65);

            // Draw Nested Graphic Placeholder
            ctx.fillStyle = "#e67e22";
            ctx.beginPath();
            ctx.arc(82, 462, 14, 0, Math.PI * 2);
            ctx.fill();

            // Logo Brand Labeling
            ctx.fillStyle = "#27853c";
            ctx.font = "italic bold 48px Georgia, serif";
            ctx.fillText(brandTop, 135, 415);

            ctx.fillStyle = "#34495e";
            ctx.font = "800 40px sans-serif";
            ctx.fillText(brandBottom, 155, 465);
            
            ctx.restore(); // Terminate front translation bounds

            // ----------------------------------------------------
            // RENDER BLOCK 2: BACK SIDE (BOTTOM ELEMENT)
            // ----------------------------------------------------
            ctx.save();
            ctx.translate(padding, padding + cardH + gap); // Translate coordinates to bottom zone
            
            // Base Background
            ctx.fillStyle = "#e2f3e5";
            ctx.fillRect(0, 0, cardW, cardH);

            // Lower Dark Shape Gradient
            let backGradient = ctx.createLinearGradient(0, 0, cardW, cardH);
            backGradient.addColorStop(0, '#3d8c55');
            backGradient.addColorStop(1, '#1d4d2b');

            ctx.fillStyle = backGradient;
            ctx.beginPath();
            ctx.moveTo(0, 330);
            ctx.bezierCurveTo(360, 480, 660, 270, 1050, 405);
            ctx.lineTo(1050, 600);
            ctx.lineTo(0, 600);
            ctx.closePath();
            ctx.fill();

            // Secondary Accent Layer
            ctx.fillStyle = "#225933";
            ctx.beginPath();
            ctx.moveTo(0, 375);
            ctx.bezierCurveTo(390, 510, 630, 315, 1050, 441);
            ctx.lineTo(1050, 600);
            ctx.lineTo(0, 600);
            ctx.closePath();
            ctx.fill();

            // Render Contact Block Text Data
            ctx.fillStyle = "#2d4030";
            ctx.font = "bold 22px sans-serif";

            // Address context strings
            ctx.fillText("📍 " + addr1, 60, 180);
            ctx.fillText("   " + addr2, 60, 215);

            // Phone & Mail Text Info Block
            ctx.fillText("📞 " + phone, 520, 430);
            ctx.fillText("✉️ " + email, 520, 475);

            // Lower Layout Website Address Label Rendering
            ctx.fillStyle = "#d5ebd9";
            ctx.font = "500 20px sans-serif";
            ctx.fillText("🌐 " + web, 750, 550);

            // Generate Clean Isolated Mock QR Shape Blocks
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(60, 410, 140, 140);
            
            ctx.fillStyle = "#225933";
            // Outer anchoring square structures
            ctx.fillRect(75, 425, 45, 45);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(85, 435, 25, 25);
            ctx.fillStyle = "#225933"; ctx.fillRect(92, 442, 11, 11);

            ctx.fillRect(140, 425, 45, 45);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(150, 435, 25, 25);
            ctx.fillStyle = "#225933"; ctx.fillRect(157, 442, 11, 11);

            ctx.fillRect(75, 490, 45, 45);
            ctx.fillStyle = "#ffffff"; ctx.fillRect(85, 500, 25, 25);
            ctx.fillStyle = "#225933"; ctx.fillRect(92, 507, 11, 11);
            
            // Add scattered noise blocks to simulate modern nested QR profiles
            ctx.fillRect(140, 490, 15, 15);
            ctx.fillRect(165, 510, 20, 25);
            ctx.fillRect(145, 530, 15, 10);
            
            ctx.restore(); // Terminate back side layout rules cleanly

            // ----------------------------------------------------
            // IMAGE EXPORT PROCESS PIPELINE
            // ----------------------------------------------------
            const dataUrl = canvas.toDataURL("image/png");
            
            // Fire local standard asset device downstream download trigger
            const linkDownload = document.createElement('a');
            linkDownload.download = `BusinessCard_Showcase.png`;
            linkDownload.href = dataUrl;
            linkDownload.click();
        }
    </script>
</body>
</html>
