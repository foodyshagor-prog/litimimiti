<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Premium Business Card Designer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #111317 0%, #1a1d24 100%);
            --panel-bg: #1e222b;
            --input-bg: #272c38;
            --accent-orange: #e07a1d;
            --text-main: #ffffff;
            --text-muted: #9fa6b5;
            --card-width: 350px;
            --card-height: 200px;
            --card-bg-dark: #2f333a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
            background: var(--bg-gradient);
            color: var(--text-main);
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* --- PREVIEW VIEWPORT (TOP - FIXED) --- */
        .preview-viewport {
            flex-shrink: 0;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 10;
        }

        .view-toggle {
            display: flex;
            background: var(--panel-bg);
            padding: 4px;
            border-radius: 30px;
            margin-bottom: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            width: 85%;
            max-width: 280px;
        }

        .toggle-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .toggle-btn.active {
            background: var(--accent-orange);
            color: #ffffff;
        }

        /* --- CARD CANVAS GRAPHICS --- */
        .card-wrapper {
            width: var(--card-width);
            height: var(--card-height);
            position: relative;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            display: none;
            background: var(--card-bg-dark);
        }

        .card-wrapper.active {
            display: block;
        }

        .card-stage {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .card-bg-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .card-content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* --- FRONT SIDE ELEMENTS --- */
        .front-url {
            position: absolute;
            right: 25px;
            top: 15px;
            color: #ffffff;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .front-brand-block {
            position: absolute;
            right: 40px;
            top: 105px;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 130px;
            text-align: center;
        }

        .logo-text-title {
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-orange);
            letter-spacing: 0.5px;
            margin-top: 5px;
            line-height: 1.1;
            text-transform: uppercase;
        }

        .logo-text-title span {
            color: #ffffff;
        }

        .logo-text-tagline {
            font-size: 7px;
            color: #ffffff;
            letter-spacing: 1.2px;
            margin-top: 2px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        /* --- BACK SIDE ELEMENTS --- */
        .back-identity-card {
            position: absolute;
            left: 25px;
            top: 30px;
            border-left: 2px solid var(--accent-orange);
            padding-left: 10px;
        }

        .back-name {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .back-name span {
            color: #ffffff;
        }

        .back-title {
            font-size: 9px;
            color: #ffffff;
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 1px;
            text-transform: uppercase;
        }

        .back-meta-list {
            position: absolute;
            left: 25px;
            bottom: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .meta-icon {
            width: 13px;
            height: 13px;
            background: var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1px;
        }

        .meta-text {
            font-size: 8.5px;
            color: #ffffff;
            font-weight: 500;
        }

        .meta-address {
            font-size: 8px;
            color: #ffffff;
            opacity: 0.75;
            margin-top: 2px;
            line-height: 1.3;
            max-width: 160px;
        }

        /* --- SCROLLABLE FORM EDITOR PANEL (BOTTOM) --- */
        .editor-panel {
            flex-grow: 1;
            min-height: 0;
            background: var(--panel-bg);
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 20px 18px;
            
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch; 
            
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .panel-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel-section-heading {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-orange);
            font-weight: 700;
            padding-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        label {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 500;
        }

        input {
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 10px 12px;
            color: #ffffff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s ease;
            width: 100%;
        }

        input:focus {
            border-color: var(--accent-orange);
        }

        /* Custom File Upload Styling */
        .upload-wrapper {
            position: relative;
            background: var(--input-bg);
            border: 1px dashed var(--accent-orange);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }

        .upload-wrapper input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .upload-label-text {
            font-size: 12px;
            color: var(--accent-orange);
            font-weight: 600;
        }

        /* --- EXPORT ACTION BUTTON --- */
        .save-btn {
            background: var(--accent-orange);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            margin-top: 8px;
            margin-bottom: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(224, 122, 29, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .save-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="preview-viewport">
        <div class="view-toggle">
            <button class="toggle-btn active" id="btn-front" onclick="switchSide('front')">Front Side</button>
            <button class="toggle-btn" id="btn-back" onclick="switchSide('back')">Back Side</button>
        </div>

        <div class="card-wrapper active" id="container-front">
            <div class="card-stage">
                <svg class="card-bg-layer" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <defs>
                        <clipPath id="front-photo-clip">
                            <path d="M 0,0 L 160,0 C 185,45 135,145 185,200 L 0,200 Z" />
                        </clipPath>
                    </defs>
                    <rect width="350" height="200" fill="#2f333a"/>
                    <g clip-path="url(#front-photo-clip)">
                        <image id="img-render-front" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a3f47'/><circle cx='50' cy='50' r='30' fill='%23e07a1d' opacity='0.15'/></svg>" width="210" height="200" preserveAspectRatio="xMidYMid slice" />
                    </g>
                    <path d="M 160,0 C 185,45 135,145 185,200" stroke="#e07a1d" stroke-width="5.5" fill="none" />
                    <path d="M 125,200 C 190,175 220,70 350,45" stroke="#e07a1d" stroke-width="7" fill="none" />
                </svg>
                <div class="card-content-layer">
                    <div class="front-url bind-text-front-web">WWW.YOURWEBSITE.COM</div>
                    <div class="front-brand-block">
                        <svg width="42" height="26" viewBox="0 0 60 35">
                            <polygon points="12,32 26,12 40,32" stroke="#e07a1d" stroke-width="2.5" fill="none"/>
                            <polygon points="24,32 38,12 52,32" stroke="#e07a1d" stroke-width="2.5" fill="none"/>
                            <polygon points="18,32 32,5 46,32" fill="#ffffff" stroke="#e07a1d" stroke-width="2"/>
                        </svg>
                        <div class="logo-text-title"><span class="bind-text-c1">Company</span> <span id="target-c2" style="color:#fff;">Logo</span></div>
                        <div class="logo-text-tagline bind-text-tag">Tagline Here</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="card-wrapper" id="container-back">
            <div class="card-stage">
                <svg class="card-bg-layer" viewBox="0 0 350 200" preserveAspectRatio="none">
                    <defs>
                        <clipPath id="back-photo-clip">
                            <path d="M 350,200 L 205,200 C 160,165 210,65 160,0 L 350,0 Z" />
                        </clipPath>
                    </defs>
                    <rect width="350" height="200" fill="#2f333a"/>
                    <g clip-path="url(#back-photo-clip)">
                        <image id="img-render-back" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 100 100'><rect width='100' height='100' fill='%233a3f47'/><circle cx='50' cy='50' r='30' fill='%23e07a1d' opacity='0.15'/></svg>" x="140" width="210" height="200" preserveAspectRatio="xMidYMid slice" />
                    </g>
                    <path d="M 205,200 C 160,165 210,65 160,0" stroke="#e07a1d" stroke-width="5.5" fill="none" />
                    <path d="M 225,0 C 160,25 130,130 0,155" stroke="#e07a1d" stroke-width="7" fill="none" />
                </svg>
                <div class="card-content-layer">
                    <div class="back-identity-card">
                        <div class="back-name"><span class="bind-text-fn">Divine</span> <span class="bind-text-ln">Victory</span></div>
                        <div class="back-title bind-text-title">Graphic Designer</div>
                    </div>
                    
                    <div class="back-meta-list">
                        <div class="meta-row">
                            <div class="meta-icon">
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="#fff"><path d="M20 22.6c-2.7 0-5.8-1.1-8.9-3.1-3.1-2-5.7-4.7-7.6-7.6C1.4 8.7.3 5.7.3 3c0-1.5.6-2.4 1.7-2.8L5.4.3c.7-.3 1.6 0 2 .8l2 3.8c.3.6.1 1.4-.4 1.9L7.8 8c1.3 2 2.9 3.6 4.9 4.9l1.2-1.2c.5-.5 1.3-.7 1.9-.4l3.8 2.5c.8.4 1.1 1.3.8 2l-1 3.4c-.3 1.1-1.3 1.9-2.9 1.9z"/></svg>
                            </div>
                            <span class="meta-text bind-text-phone">+01 2345 67890</span>
                        </div>
                        <div class="meta-row">
                            <div class="meta-icon">
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="#fff"><path d="M22 4H2c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-10 6.25L2 8V6l10 6.25L22 6v2z"/></svg>
                            </div>
                            <span class="meta-text bind-text-email">info@company.com</span>
                        </div>
                        <div class="meta-row">
                            <div class="meta-icon">
                                <svg width="8" height="8" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.53c-.26-.81-1-1.4-1.9-1.4h-1v-3c0-.55-.45-1-1-1h-6v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                            </div>
                            <span class="meta-text bind-text-back-web">www.company.com</span>
                        </div>
                        <div class="meta-address bind-text-loc">123 Street Name Here, Block C,<br>Town, CA, United States.</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="editor-panel">
        
        <div class="panel-section">
            <div class="panel-section-heading">Graphic Photo Asset</div>
            <div class="input-group">
                <label>Card Feature Image</label>
                <div class="upload-wrapper">
                    <span class="upload-label-text" id="upload-status-label">Choose Photo / Import Shot</span>
                    <input type="file" id="field-user-image" accept="image/*" onchange="processUserImage(this)">
                </div>
            </div>
        </div>

        <div class="panel-section">
            <div class="panel-section-heading">Identity Elements</div>
            <div class="input-row">
                <div class="input-group" style="flex:1;">
                    <label>Company Word 1</label>
                    <input type="text" id="field-c1" value="Company">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Company Word 2</label>
                    <input type="text" id="field-c2" value="Logo">
                </div>
            </div>
            <div class="input-group">
                <label>Brand Tagline</label>
                <input type="text" id="field-tag" value="Tagline Here">
            </div>
            <div class="input-group">
                <label>Front Header Website Link</label>
                <input type="text" id="field-front-web" value="WWW.YOURWEBSITE.COM">
            </div>
        </div>

        <div class="panel-section">
            <div class="panel-section-heading">Personal Cardholder</div>
            <div class="input-row">
                <div class="input-group" style="flex:1;">
                    <label>First Name</label>
                    <input type="text" id="field-fn" value="Divine">
                </div>
                <div class="input-group" style="flex:1;">
                    <label>Last Name</label>
                    <input type="text" id="field-ln" value="Victory">
                </div>
            </div>
            <div class="input-group">
                <label>Job Designation</label>
                <input type="text" id="field-title" value="Graphic Designer">
            </div>
        </div>

        <div class="panel-section">
            <div class="panel-section-heading">Communication Links</div>
            <div class="input-group">
                <label>Phone Line</label>
                <input type="text" id="field-phone" value="+01 2345 67890">
            </div>
            <div class="input-group">
                <label>Email ID Address</label>
                <input type="email" id="field-email" value="info@company.com">
            </div>
            <div class="input-group">
                <label>Back Side Website Link</label>
                <input type="text" id="field-back-web" value="www.company.com">
            </div>
            <div class="input-group">
                <label>Physical Workplace Location</label>
                <input type="text" id="field-loc" value="123 Street Name Here, Block C, Town, CA, United States.">
            </div>
        </div>

        <button class="save-btn" onclick="triggerCardDownload()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save Card Image Output
        </button>
    </div>

    <script>
        let surfaceSide = 'front';

        function switchSide(side) {
            surfaceSide = side;
            document.querySelectorAll('.card-wrapper').forEach(card => card.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            
            if (side === 'front') {
                document.getElementById('container-front').classList.add('active');
                document.getElementById('btn-front').classList.add('active');
            } else {
                document.getElementById('container-back').classList.add('active');
                document.getElementById('btn-back').classList.add('active');
            }
        }

        // Processing Local Device Images Safely for WebViews without CORS faults
        function processUserImage(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('img-render-front').setAttribute('href', e.target.result);
                    document.getElementById('img-render-back').setAttribute('href', e.target.result);
                    document.getElementById('upload-status-label').textContent = "Photo Loaded Successfully!";
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        // Live Synchronous Data-Binding Pipeline
        function bindInputToUI(inputId, targetClass, isSpecialC2 = false) {
            const inputField = document.getElementById(inputId);
            inputField.addEventListener('input', (event) => {
                const textVal = event.target.value;
                if (isSpecialC2) {
                    document.getElementById('target-c2').textContent = textVal;
                } else {
                    document.querySelectorAll('.' + targetClass).forEach(el => {
                        if (targetClass === 'bind-text-loc') {
                            el.innerHTML = textVal.replace(/,/g, ',<br>');
                        } else {
                            el.textContent = textVal;
                        }
                    });
                }
            });
        }

        // Link Data Connectors
        bindInputToUI('field-c1', 'bind-text-c1');
        bindInputToUI('field-c2', '', true);
        bindInputToUI('field-tag', 'bind-text-tag');
        bindInputToUI('field-front-web', 'bind-text-front-web');
        bindInputToUI('field-fn', 'bind-text-fn');
        bindInputToUI('field-ln', 'bind-text-ln');
        bindInputToUI('field-title', 'bind-text-title');
        bindInputToUI('field-phone', 'bind-text-phone');
        bindInputToUI('field-email', 'bind-text-email');
        bindInputToUI('field-back-web', 'bind-text-back-web');
        bindInputToUI('field-loc', 'bind-text-loc');

        // High Definition Combined Studio Render Export Engine
        function triggerCardDownload() {
            const originalSide = surfaceSide;

            // Sequential capture ensures hidden items get accurate calculations inside html2canvas
            switchSide('front');
            html2canvas(document.getElementById('container-front'), {
                scale: 3, 
                backgroundColor: null,
                logging: false,
                useCORS: true,
                allowTaint: true
            }).then(frontCanvas => {
                
                switchSide('back');
                html2canvas(document.getElementById('container-back'), {
                    scale: 3,
                    backgroundColor: null,
                    logging: false,
                    useCORS: true,
                    allowTaint: true
                }).then(backCanvas => {
                    
                    // Return workspace back to user's selected active tab state
                    switchSide(originalSide);

                    // Create master composition canvas layout
                    const masterCanvas = document.createElement('canvas');
                    const ctx = masterCanvas.getContext('2d');

                    // Studio presentation sizing config (Values adjusted proportionally for scale: 3)
                    const paddingX = 90;      // Outer horizontal margins 
                    const paddingY = 90;      // Outer vertical margins
                    const verticalGap = 70;   // Space separating the front and back cards

                    const cardWidth = frontCanvas.width;
                    const cardHeight = frontCanvas.height;

                    const masterWidth = cardWidth + (paddingX * 2);
                    const masterHeight = (cardHeight * 2) + verticalGap + (paddingY * 2);

                    masterCanvas.width = masterWidth;
                    masterCanvas.height = masterHeight;

                    // Apply the clear light-gray presentation background matching target setup
                    ctx.fillStyle = '#f0f2f5';
                    ctx.fillRect(0, 0, masterWidth, masterHeight);

                    // Compute clean centered coordinates
                    const horizontalX = paddingX; 
                    const frontY = paddingY;
                    const backY = paddingY + cardHeight + verticalGap;

                    // Draw layered cards onto custom template
                    ctx.drawImage(frontCanvas, horizontalX, frontY);
                    ctx.drawImage(backCanvas, horizontalX, backY);

                    // Execute image pipeline generation download
                    const outputUri = masterCanvas.toDataURL('image/png');
                    const downloaderLink = document.createElement('a');
                    downloaderLink.download = `PremiumCard_Presentation_${Date.now()}.png`;
                    downloaderLink.href = outputUri;
                    document.body.appendChild(downloaderLink);
                    downloaderLink.click();
                    document.body.removeChild(downloaderLink);
                });
            }).catch(error => {
                console.error("Canvas composite presentation transformation failure: ", error);
                switchSide(originalSide);
            });
        }
    </script>
</body>
</html>
